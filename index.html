<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emera Player & Radio</title>
    <!-- Favicon SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3'/></svg>">
    <!-- JS Media Tags -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <!-- Polyfill Drag and Drop -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Sliders Padrão */
        .standard-slider { -webkit-appearance: none; width: 100%; background: transparent; }
        .standard-slider::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: #10b981; cursor: pointer; margin-top: -4px; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); transition: transform 0.1s; }
        .standard-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }
        .standard-slider::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #374151; border-radius: 2px; }
        .standard-slider:focus { outline: none; }
        
        /* Tuner de Rádio Analógico (NOVO) */
        .tuner-dial { -webkit-appearance: none; width: 100%; height: 24px; background: repeating-linear-gradient(90deg, #4b5563, #4b5563 2px, transparent 2px, transparent 5%); border-radius: 4px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.8); cursor: crosshair; }
        .tuner-dial::-webkit-slider-thumb { -webkit-appearance: none; width: 4px; height: 34px; background: #ef4444; cursor: grab; border-radius: 2px; box-shadow: 0 0 10px rgba(239,68,68,0.9); }
        .tuner-dial::-webkit-slider-thumb:active { cursor: grabbing; }
        .tuner-dial:focus { outline: none; }

        .progress-bar-container { position: relative; width: 100%; display: flex; align-items: center; }
        .progress-fill { position: absolute; height: 4px; background: #10b981; border-radius: 2px; pointer-events: none; top: 50%; transform: translateY(-50%); left: 0; width: 0%; }
        
        .spin-slow { animation: spin 8s linear infinite; }
        .spin-paused { animation-play-state: paused; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        @media (min-width: 768px) { .custom-scrollbar::-webkit-scrollbar { width: 6px; } }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 20px; }
        
        input[type=range][orient=vertical] { writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 8px; height: 100%; padding: 0 5px; cursor: pointer; }
        .drag-over { border: 2px dashed #10b981 !important; background-color: rgba(16, 185, 129, 0.1) !important; }
        @media (min-width: 768px) { .playlist-item .actions { opacity: 0; transition: opacity 0.2s; } .playlist-item:hover .actions { opacity: 1; } }

        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .toast-exit-active { transform: translateY(100%); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        #player-bg { transition: background 1s ease-in-out; }
        .radio-mode-progress input[type=range]::-webkit-slider-thumb { display: none; }
        .radio-mode-progress input[type=range] { pointer-events: none; }
        
        /* Ruído Visual (Estática na Capa) */
        .static-noise { filter: grayscale(100%) contrast(300%) opacity(0.2); animation: staticShake 0.2s infinite; }
        @keyframes staticShake { 0% { transform: translate(1px, 1px) scale(1.05); } 50% { transform: translate(-1px, -2px) scale(1.05); } 100% { transform: translate(-2px, 1px) scale(1.05); } }
    </style>
</head>
<body class="bg-gray-950 min-h-[100dvh] md:min-h-screen text-gray-100 font-sans selection:bg-emerald-500 selection:text-white flex items-center justify-center md:p-4 lg:p-8 overflow-hidden md:overflow-auto">

    <div class="w-full max-w-5xl bg-gray-900 md:rounded-[2rem] shadow-2xl flex flex-col md:flex-row overflow-hidden border-0 md:border border-gray-800 h-[100dvh] md:h-[85vh] md:min-h-[600px] md:max-h-[800px]">
        
        <!-- Lado Esquerdo: Player Principal -->
        <div class="w-full md:w-3/5 p-4 sm:p-6 md:p-8 flex flex-col relative h-[55%] sm:h-[60%] md:h-full overflow-y-auto custom-scrollbar flex-shrink-0 md:flex-shrink" id="player-bg" style="background: linear-gradient(to bottom, #1f2937 0%, #111827 100%);">
            
            <div class="flex justify-between items-center mb-3 sm:mb-6 md:mb-8 flex-shrink-0 relative z-10">
                <div class="flex items-center gap-2 select-none">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 text-emerald-500 drop-shadow-[0_0_8px_rgba(16,185,129,0.5)]" viewBox="0 0 24 24" fill="currentColor"><path d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
                    <span class="text-xs sm:text-sm font-black tracking-[0.2em] text-emerald-500 uppercase hidden sm:block">Emera</span>
                </div>
                
                <!-- Abas Alternadoras -->
                <div class="flex bg-gray-800/80 p-1 rounded-lg">
                    <button id="tab-local" class="text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-md bg-emerald-600 text-white transition shadow-sm">Músicas</button>
                    <button id="tab-radio" class="text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-md text-gray-400 hover:text-white transition">Rádio AM/FM</button>
                </div>

                <div class="flex items-center gap-2">
                    <button id="install-app-btn" class="hidden text-[10px] sm:text-xs bg-emerald-600 hover:bg-emerald-500 text-white py-1.5 px-3 rounded-full transition flex items-center gap-1.5 shadow-sm"><svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg><span class="hidden sm:inline">Instalar</span></button>
                    <button id="settings-btn" class="text-gray-300 hover:text-white transition" title="Configurações"><svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></button>
                </div>
            </div>

            <!-- Capa do Álbum / Disco -->
            <div class="flex-1 min-h-0 flex items-center justify-center mb-4 sm:mb-6 md:mb-8 relative z-10">
                <div class="relative w-auto h-full aspect-square max-h-32 sm:max-h-48 md:max-h-72 rounded-full shadow-[0_0_30px_rgba(0,0,0,0.5)] md:shadow-[0_0_50px_rgba(0,0,0,0.5)] overflow-hidden border-4 border-gray-800 flex items-center justify-center group">
                    <img id="cover-art" crossorigin="anonymous" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&h=500&fit=crop" alt="Capa da Música" class="w-full h-full object-cover spin-slow spin-paused transition-all duration-500 relative z-10 bg-gray-800">
                    <canvas id="visualizer" class="absolute inset-0 w-full h-full z-20 opacity-60 pointer-events-none mix-blend-screen"></canvas>
                    <div class="absolute inset-0 m-auto w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 bg-gray-900 rounded-full border-2 border-gray-700 shadow-inner z-30"></div>
                    
                    <!-- Botão Alternar Visualizador -->
                    <button id="toggle-vis-btn" class="absolute bottom-2 right-2 sm:bottom-4 sm:right-4 z-40 bg-black/60 hover:bg-emerald-600 text-white p-1.5 sm:p-2 rounded-full opacity-0 group-hover:opacity-100 transition shadow-lg" title="Mudar Visualizador">
                        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Informações da Música -->
            <div class="text-center mb-4 sm:mb-6 md:mb-8 relative flex-shrink-0 z-10">
                <button id="main-favorite-btn" class="absolute right-0 top-1 text-gray-300 hover:text-red-500 transition hidden"><svg class="w-6 h-6 md:w-7 md:h-7" id="main-fav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg></button>
                <h2 id="track-title" class="text-lg sm:text-xl md:text-3xl font-bold text-white truncate px-8 md:px-10" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Playlist Vazia</h2>
                <p id="track-artist" class="text-gray-300 mt-1 md:mt-2 text-xs sm:text-sm md:text-base">Adicione músicas para começar</p>
            </div>

            <!-- Controles de Progresso -->
            <div id="progress-wrapper" class="mb-4 sm:mb-6 md:mb-8 w-full px-1 sm:px-4 md:px-8 flex-shrink-0 z-10">
                <div class="progress-bar-container group">
                    <div class="progress-fill group-hover:bg-emerald-400 transition-colors" id="progress-fill"></div>
                    <input type="range" id="progress-bar" min="0" max="100" value="0" class="standard-slider z-10 relative">
                </div>
                <div class="flex justify-between mt-2 text-[10px] md:text-xs text-gray-300 font-medium tracking-wide">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <!-- Controles de Mídia -->
            <div class="flex items-center justify-center gap-4 sm:gap-6 md:gap-8 flex-shrink-0 pb-2 md:pb-0 z-10">
                <button id="repeat-btn" class="text-gray-300 hover:text-emerald-500 transition hidden sm:block" title="Repetir Lista/Música"><svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></button>
                <button id="prev-btn" class="text-white hover:text-emerald-400 transition transform hover:scale-110"><svg class="w-7 h-7 sm:w-8 sm:h-8 md:w-10 md:h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 19h2V5H5v14z"></path></svg></button>
                <button id="play-pause-btn" class="w-14 h-14 sm:w-16 sm:h-16 md:w-20 md:h-20 bg-emerald-500 rounded-full flex items-center justify-center text-white hover:bg-emerald-400 hover:scale-105 transition shadow-[0_0_15px_rgba(16,185,129,0.3)] md:shadow-[0_0_20px_rgba(16,185,129,0.4)]">
                    <svg id="play-icon" class="w-6 h-6 md:w-8 md:h-8 ml-1 md:ml-2" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                    <svg id="pause-icon" class="w-6 h-6 md:w-8 md:h-8 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
                </button>
                <button id="next-btn" class="text-white hover:text-emerald-400 transition transform hover:scale-110"><svg class="w-7 h-7 sm:w-8 sm:h-8 md:w-10 md:h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zm14 1h-2v14h2V5z"></path></svg></button>
                <button id="shuffle-btn" class="text-gray-300 hover:text-emerald-500 transition hidden sm:block" title="Aleatório"><svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg></button>
                <button id="eq-btn" class="text-gray-300 hover:text-emerald-500 transition ml-0 sm:ml-2" title="Equalizador"><svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg></button>
            </div>
        </div>

        <!-- Lado Direito: Listas, Sintonizador e Volume -->
        <div class="w-full md:w-2/5 bg-gray-900 border-t md:border-t-0 md:border-l border-gray-800 flex flex-col flex-1 min-h-[35%] md:min-h-0 overflow-hidden">
            
            <!-- Controle de Volume -->
            <div class="p-4 md:p-6 border-b border-gray-800 flex items-center gap-3 md:gap-4 flex-shrink-0">
                <button id="mute-btn" class="text-gray-400 hover:text-white transition"><svg id="vol-icon" class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg></button>
                <div class="progress-bar-container flex-1">
                    <div class="progress-fill bg-emerald-500" id="vol-fill" style="width: 100%;"></div>
                    <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" class="standard-slider z-10 relative">
                </div>
            </div>

            <!-- Cabeçalho Dinâmico da Lista -->
            <div class="p-4 md:p-6 pb-2 md:pb-2 flex flex-col gap-3 flex-shrink-0 border-b border-gray-800/50">
                <div class="flex justify-between items-end gap-2">
                    <div class="flex flex-col gap-1">
                        <h3 id="list-title" class="text-base md:text-lg font-semibold text-white flex items-center gap-2">
                            <svg class="w-4 h-4 md:w-5 md:h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                            Sua Playlist
                        </h3>
                        <select id="sort-select" class="bg-transparent text-[10px] md:text-xs text-gray-400 outline-none hover:text-emerald-400 transition cursor-pointer p-0 border-0">
                            <option value="recent" class="bg-gray-800 text-white">Adicionadas Recentemente</option>
                            <option value="most_played" class="bg-gray-800 text-white">Mais Tocadas</option>
                        </select>
                    </div>
                    
                    <div id="local-actions" class="flex items-center gap-1.5 sm:gap-2">
                        <input type="file" id="folder-upload" webkitdirectory directory multiple class="sr-only">
                        <label for="folder-upload" class="cursor-pointer text-[10px] md:text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 py-1.5 px-2 md:px-3 rounded-lg border border-gray-700 transition flex items-center gap-1 shadow-sm" title="Importar Pasta Inteira">
                            <svg class="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                            <span class="hidden sm:inline">Pasta</span>
                        </label>

                        <input type="file" id="file-upload" accept="audio/*,audio/mp3,audio/wav,audio/mpeg,audio/ogg,.mp3,.wav,.ogg" multiple class="sr-only">
                        <label for="file-upload" class="cursor-pointer text-[10px] md:text-xs bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-400 py-1.5 px-2 md:px-3 rounded-lg border border-emerald-600/30 transition flex items-center gap-1 shadow-sm">
                            <svg class="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            <span class="hidden sm:inline">Arquivos</span>
                        </label>
                    </div>
                </div>
                
                <!-- Pesquisa Local -->
                <div id="local-search-container" class="relative w-full">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-3 h-3 md:w-4 md:h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="search-input" placeholder="Buscar..." class="w-full bg-gray-800/50 text-xs sm:text-sm text-gray-200 rounded-lg pl-9 pr-3 py-2 outline-none border border-gray-700 focus:border-emerald-500 focus:bg-gray-800 transition">
                </div>

                <!-- Sintonizador de Rádio Analógico (NOVO) -->
                <div id="radio-tuner-container" class="hidden w-full flex-col gap-2 mt-2 bg-gray-950/60 p-3 md:p-4 rounded-xl border border-gray-800 shadow-inner">
                    <div class="flex justify-between items-end px-1 md:px-2 select-none">
                        <span class="text-[10px] sm:text-xs text-gray-500 font-bold uppercase tracking-[0.3em]">FM MHz</span>
                        <div class="flex items-center gap-3">
                            <span id="tuner-display" class="text-2xl sm:text-3xl font-mono font-black text-emerald-500 drop-shadow-[0_0_8px_rgba(16,185,129,0.5)]">87.5</span>
                            <span id="tuner-status" class="text-[9px] sm:text-[10px] text-red-500 font-bold uppercase tracking-widest w-24 text-right">○ Ruído</span>
                        </div>
                    </div>
                    <div class="pt-2 pb-1 relative">
                        <!-- Régua de Fundo -->
                        <input type="range" id="tuner-slider" min="87.5" max="108.0" step="0.1" value="87.5" class="tuner-dial">
                    </div>
                </div>

            </div>

            <!-- Lista Renderizada -->
            <div class="flex-1 overflow-y-auto custom-scrollbar p-2 sm:p-4" id="list-container"></div>
        </div>
    </div>

    <!-- Modais -->
    <div id="eq-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-gray-900 p-5 sm:p-8 rounded-[1.5rem] border border-gray-800 w-full sm:w-[90%] max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-4 sm:mb-6">
                <h3 class="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    Equalizador (Apenas MP3)
                </h3>
                <button id="close-eq-btn" class="text-gray-400 hover:text-white transition"><svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="flex gap-2 justify-center mb-6 flex-wrap">
                <button class="eq-preset-btn text-[10px] sm:text-xs bg-gray-800 hover:bg-emerald-600 text-gray-300 hover:text-white px-3 py-1 rounded-full transition" data-preset="0,0,0,0,0">Flat</button>
                <button class="eq-preset-btn text-[10px] sm:text-xs bg-gray-800 hover:bg-emerald-600 text-gray-300 hover:text-white px-3 py-1 rounded-full transition" data-preset="5,3,0,2,4">Rock</button>

                <button class="eq-preset-btn text-[10px] sm:text-xs bg-gray-800 hover:bg-emerald-600 text-gray-300 hover:text-white px-3 py-1 rounded-full transition" data-preset="2,1,0,2,3">Acústico</button>

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>

    <div id="toast-container" class="fixed bottom-4 right-4 sm:bottom-8 sm:right-8 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <audio id="audio-player" crossorigin="anonymous"></audio>
    <audio id="radio-audio"></audio>

    <script>
        // --- TOASTS ---
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast-enter bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-[0_4px_15px_rgba(16,185,129,0.3)] text-xs sm:text-sm flex items-center gap-3 font-medium pointer-events-auto';
            toast.innerHTML = `<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>${message}`;
            document.getElementById('toast-container').appendChild(toast);
            requestAnimationFrame(() => toast.classList.replace('toast-enter', 'toast-enter-active'));
            setTimeout(() => { toast.classList.replace('toast-enter-active', 'toast-exit-active'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // --- BANCO DE DADOS ---
        const DB_NAME = "MusicPlayerDB"; const STORE_NAME = "local_tracks"; let db;
        function initDB() { return new Promise(r => { const req = indexedDB.open(DB_NAME, 1); req.onerror=()=>r(null); req.onsuccess=e=>{db=e.target.result; r(db);}; req.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(STORE_NAME)) e.target.result.createObjectStore(STORE_NAME, {keyPath:"id"});}; }); }
        function saveTrackToDB(track) { if(db){ const t={...track}; delete t.src; db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).put(t); } }
        function deleteTrackFromDB(id) { if(db) db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).delete(id); }
        function loadTracksFromDB() {
            if(!db) return Promise.resolve();
            return new Promise(r => { const req = db.transaction(STORE_NAME, "readonly").objectStore(STORE_NAME).getAll(); req.onsuccess = () => { req.result.forEach(t => { t.src = URL.createObjectURL(t.file); t.playCount = t.playCount||0; t.addedAt = t.addedAt||Date.now(); playlist.push(t); }); r(); }; req.onerror = () => r(); });
        }

        // --- ESTAÇÕES COM FREQUÊNCIA ---
        const radioStations = [
            { freq: "89.1", title: "Rádio Rock 89FM", artist: "Rock Alternativo", src: "https://89fm.crossradio.com.br/stream/1;", cover: "https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?w=500&h=500&fit=crop" },
            { freq: "94.7", title: "Antena 1", artist: "Pop / Clássicos", src: "https://antena1.newradio.it/stream", cover: "https://images.unsplash.com/photo-1516280440502-3c469f64c295?w=500&h=500&fit=crop" },
            { freq: "101.7", title: "Alpha FM", artist: "Flashback", src: "https://icecast.uol.com.br/alphafm", cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&h=500&fit=crop" },
            { freq: "104.3", title: "Nova Brasil FM", artist: "MPB", src: "https://icecast.uol.com.br/novabrasil", cover: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=500&h=500&fit=crop" },
            { freq: "107.9", title: "Lofi Girl (Zeno)", artist: "Chill / Beats", src: "http://stream.zeno.fm/f3wvbbqmdg8uv", cover: "https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=500&h=500&fit=crop" }
        ];

        // --- ESTADO ---
        const audioLocal = document.getElementById('audio-player'); const audioRadio = document.getElementById('radio-audio');
        let currentView = 'local'; let playingMode = 'local'; let isPlaying = false, currentTrackIndex = 0, currentRadioIndex = 0, currentSortMode = 'recent', playlist = [], draggedItemIndex = null;
        let isShuffle = JSON.parse(localStorage.getItem('webPlayerShuffle')) || false; let isRepeat = JSON.parse(localStorage.getItem('webPlayerRepeat')) || false;
        const savedEq = JSON.parse(localStorage.getItem('webPlayerEq')) || [0,0,0,0,0];
        let audioCtx, sourceNode, analyser, eqFilters = [], eqFrequencies = [60, 230, 910, 3600, 14000];
        let visualizerMode = 0; let sleepTimerId = null; let isTuned = false; // Estado do sintonizador

        const DOM = {
            playPause: document.getElementById('play-pause-btn'), playIcon: document.getElementById('play-icon'), pauseIcon: document.getElementById('pause-icon'),
            prev: document.getElementById('prev-btn'), next: document.getElementById('next-btn'), shuffle: document.getElementById('shuffle-btn'), repeat: document.getElementById('repeat-btn'),
            title: document.getElementById('track-title'), artist: document.getElementById('track-artist'), cover: document.getElementById('cover-art'),
            mainFav: document.getElementById('main-favorite-btn'), mainFavIcon: document.getElementById('main-fav-icon'),
            progWrap: document.getElementById('progress-wrapper'), progBar: document.getElementById('progress-bar'), progFill: document.getElementById('progress-fill'), curTime: document.getElementById('current-time'), totTime: document.getElementById('total-time'),
            volBar: document.getElementById('volume-bar'), volFill: document.getElementById('vol-fill'), mute: document.getElementById('mute-btn'),
            container: document.getElementById('list-container'), fileUpload: document.getElementById('file-upload'), folderUpload: document.getElementById('folder-upload'),
            sortSel: document.getElementById('sort-select'), localSearchWrap: document.getElementById('local-search-container'), search: document.getElementById('search-input'), 
            radioTunerWrap: document.getElementById('radio-tuner-container'), tunerSlider: document.getElementById('tuner-slider'), tunerDisp: document.getElementById('tuner-display'), tunerStatus: document.getElementById('tuner-status'),
            playerBg: document.getElementById('player-bg'), canvas: document.getElementById('visualizer'), toggleVis: document.getElementById('toggle-vis-btn'),
            tabLocal: document.getElementById('tab-local'), tabRadio: document.getElementById('tab-radio'), localActions: document.getElementById('local-actions'), listTitle: document.getElementById('list-title')
        };
        const canvasCtx = DOM.canvas.getContext('2d');
        function getActiveAudio() { return playingMode === 'radio' ? audioRadio : audioLocal; }

        // --- WEB AUDIO ---
        function initWebAudio() {
            if(audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)(); sourceNode = audioCtx.createMediaElementSource(audioLocal); analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
                let prev = sourceNode;
                eqFrequencies.forEach((freq, i) => {
                    let f = audioCtx.createBiquadFilter(); f.type = i===0?'lowshelf':(i===4?'highshelf':'peaking'); f.frequency.value = freq; f.gain.value = savedEq[i]; if(f.type==='peaking') f.Q.value = 1;
                    eqFilters.push(f); prev.connect(f); prev = f;
                });
                prev.connect(analyser); analyser.connect(audioCtx.destination); drawVisualizer(); 
            } catch(e) {}
        }

        let audioUnlocked = false;
        function unlockAudio() { if(audioUnlocked) return; initWebAudio(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); audioLocal.load(); audioUnlocked = true; document.body.removeEventListener('touchstart', unlockAudio); document.body.removeEventListener('click', unlockAudio); }
        document.body.addEventListener('touchstart', unlockAudio, { once: true }); document.body.addEventListener('click', unlockAudio, { once: true });
        if(window.MobileDragDrop) { window.addEventListener('touchmove', function(){}, {passive:false}); MobileDragDrop.polyfill({ dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride }); }

        DOM.toggleVis.addEventListener('click', () => { visualizerMode = (visualizerMode + 1) % 3; showToast(`Visualizador: ${["Radial", "Barras", "Ondas"][visualizerMode]}`); });

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!isPlaying) return; 

            const W = DOM.canvas.clientWidth; const H = DOM.canvas.clientHeight;
            if(DOM.canvas.width !== W || DOM.canvas.height !== H) { DOM.canvas.width = W; DOM.canvas.height = H; }
            canvasCtx.clearRect(0, 0, W, H);
            
            const bufferL = 128; const dataFreq = new Uint8Array(bufferL); const dataTime = new Uint8Array(bufferL);
            
            if (playingMode === 'radio') {
                if (isTuned) {
                    const t = Date.now() / 150;
                    for(let i=0; i<bufferL; i++) { dataFreq[i] = 50 + Math.sin(t + i*0.2) * 40 + Math.random()*20; dataTime[i] = 128 + Math.sin(t*0.5 + i*0.1) * 30 + (Math.random()-0.5)*15; }
                } else {
                    // Estática Visual Completa
                    for(let i=0; i<bufferL; i++) { dataFreq[i] = Math.random() * 255; dataTime[i] = Math.random() * 255; }
                }
            } else if (analyser) {
                if(visualizerMode === 2) analyser.getByteTimeDomainData(dataTime); else analyser.getByteFrequencyData(dataFreq);
            }

            canvasCtx.lineWidth = 3;

            if (visualizerMode === 0) {
                const cX = W/2, cY = H/2, R = W/2;
                for (let i=0; i<bufferL; i++) {
                    if (dataFreq[i] === 0) continue; const h = dataFreq[i] / 2; const a = (i/bufferL)*Math.PI*2;
                    canvasCtx.beginPath(); canvasCtx.moveTo(cX+Math.cos(a)*(R-h), cY+Math.sin(a)*(R-h)); canvasCtx.lineTo(cX+Math.cos(a)*R, cY+Math.sin(a)*R); canvasCtx.strokeStyle = `rgba(16, 185, 129, ${dataFreq[i]/255})`; canvasCtx.stroke();
                }
            } else if (visualizerMode === 1) {
                const barW = (W / bufferL) * 2.5; let x = 0;
                for(let i=0; i<bufferL; i++) { const barH = dataFreq[i] * (H/255) * 0.8; canvasCtx.fillStyle = `rgba(16, 185, 129, ${dataFreq[i]/255})`; canvasCtx.fillRect(x, H - barH, barW, barH); x += barW + 1; }
            } else if (visualizerMode === 2) {
                canvasCtx.beginPath(); const sliceW = W * 1.0 / bufferL; let x = 0;
                for(let i=0; i<bufferL; i++) { const v = dataTime[i] / 128.0; const y = v * H/2; if(i===0) canvasCtx.moveTo(x, y); else canvasCtx.lineTo(x, y); x += sliceW; }
                canvasCtx.lineTo(W, H/2); canvasCtx.strokeStyle = "rgba(16, 185, 129, 0.8)"; canvasCtx.stroke();
            }
        }

        // --- EQ DOM ---
        eqFrequencies.forEach((freq, i) => {
            const col = document.createElement('div'); col.className = 'flex flex-col items-center h-full';
            const s = document.createElement('input'); s.type = 'range'; s.setAttribute('orient', 'vertical'); s.min = -12; s.max = 12; s.step = 0.5; s.value = savedEq[i]; s.className = 'flex-1 accent-emerald-500 cursor-pointer w-full max-w-[20px]';
            s.addEventListener('input', e => { const v=parseFloat(e.target.value); if(eqFilters[i]) eqFilters[i].gain.value = v; savedEq[i]=v; localStorage.setItem('webPlayerEq', JSON.stringify(savedEq)); });
            const l = document.createElement('span'); l.className = 'text-[9px] sm:text-[11px] text-gray-400 mt-2 sm:mt-3 font-mono font-bold'; l.textContent = freq>=1000?(freq/1000)+'k':freq; col.appendChild(s); col.appendChild(l); document.getElementById('eq-bands-container').appendChild(col);
        });
        document.querySelectorAll('.eq-preset-btn').forEach(btn => btn.addEventListener('click', e => {
            const p = e.target.dataset.preset.split(',').map(Number); document.getElementById('eq-bands-container').querySelectorAll('input[type=range]').forEach((s,i) => { s.value = p[i]; if(eqFilters[i]) eqFilters[i].gain.value = p[i]; savedEq[i]=p[i]; });
            localStorage.setItem('webPlayerEq', JSON.stringify(savedEq)); showToast(`Preset: ${e.target.textContent}`);
        }));

        const tModal = (m, s) => { if(s){m.classList.remove('hidden'); setTimeout(()=>m.classList.remove('opacity-0'),10);} else{m.classList.add('opacity-0'); setTimeout(()=>m.classList.add('hidden'),300);} };
        document.getElementById('eq-btn').addEventListener('click', () => { if(playingMode==='radio') showToast("Equalizador apenas para MP3"); tModal(document.getElementById('eq-modal'), true); });
        document.getElementById('close-eq-btn').addEventListener('click', () => tModal(document.getElementById('eq-modal'), false));
        document.getElementById('settings-btn').addEventListener('click', () => tModal(document.getElementById('settings-modal'), true));
        document.getElementById('close-settings-btn').addEventListener('click', () => tModal(document.getElementById('settings-modal'), false));
        document.getElementById('reset-eq-btn').addEventListener('click', () => { document.getElementById('eq-bands-container').querySelectorAll('input').forEach((s,i) => { s.value=0; if(eqFilters[i])eqFilters[i].gain.value=0; savedEq[i]=0; }); localStorage.setItem('webPlayerEq', JSON.stringify(savedEq)); showToast("Equalizador resetado"); });
        document.getElementById('clear-db-btn').addEventListener('click', () => { if(confirm("Apagar todas as músicas?")) { localStorage.clear(); indexedDB.deleteDatabase(DB_NAME).onsuccess = () => window.location.reload(); } });
        document.getElementById('start-timer-btn').addEventListener('click', () => {
            const mins = parseInt(document.getElementById('sleep-timer-input').value); if(isNaN(mins) || mins <= 0) return;
            if(sleepTimerId) clearTimeout(sleepTimerId); sleepTimerId = setTimeout(() => { if(isPlaying) togglePlay(); showToast("Temporizador: Música pausada."); }, mins * 60000);
            showToast(`Vai parar em ${mins} min`); tModal(document.getElementById('settings-modal'), false);
        });
        document.getElementById('speed-select').addEventListener('change', (e) => { audioLocal.playbackRate = parseFloat(e.target.value); audioRadio.playbackRate = parseFloat(e.target.value); showToast(`Velocidade: ${e.target.value}x`); });

        // --- SINTONIZADOR DE RÁDIO LÓGICA ---
        let tuneTimeout;
        DOM.tunerSlider.addEventListener('input', (e) => {
            if (playingMode !== 'radio') return;
            const val = parseFloat(e.target.value).toFixed(1);
            DOM.tunerDisp.textContent = val;
            
            const stationIndex = radioStations.findIndex(s => s.freq === val);
            if (tuneTimeout) clearTimeout(tuneTimeout);
            
            if (stationIndex !== -1) {
                isTuned = true;
                DOM.tunerStatus.innerHTML = '<span class="text-emerald-500 animate-pulse">● Sintonizado</span>';
                DOM.cover.classList.remove('static-noise');
                tuneTimeout = setTimeout(() => { loadAudioEntity('radio', stationIndex, false); if(isPlaying) getActiveAudio().play(); }, 400);
            } else {
                isTuned = false;
                DOM.tunerStatus.innerHTML = '<span class="text-red-500">○ Ruído</span>';
                audioRadio.pause(); 
                DOM.title.textContent = "Fora do Ar"; DOM.artist.textContent = "Ajuste a frequência...";
                DOM.cover.classList.add('static-noise');
                DOM.playerBg.style.background = `linear-gradient(to bottom, #1f2937 0%, #111827 100%)`;
                renderList(); // Atualiza lista visualmente
            }
        });

        // --- CHAMELEON UI (Cores) ---
        function getAverageColor(img) {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); canvas.width = 50; canvas.height = 50;
            try { ctx.drawImage(img, 0, 0, 50, 50); const data = ctx.getImageData(0, 0, 50, 50).data; let r=0, g=0, b=0, count=0; for (let i=0; i<data.length; i+=4) { r+=data[i]; g+=data[i+1]; b+=data[i+2]; count++; } return `rgb(${~~(r/count)}, ${~~(g/count)}, ${~~(b/count)})`; } catch(e) { return null; }
        }
        DOM.cover.addEventListener('load', () => {
            if(!isTuned && playingMode === 'radio') return;
            const color = getAverageColor(DOM.cover);
            if(color) DOM.playerBg.style.background = `linear-gradient(to bottom, ${color} 0%, rgba(17, 24, 39, 0.95) 40%, #111827 100%)`;
            else DOM.playerBg.style.background = `linear-gradient(to bottom, #1f2937 0%, #111827 100%)`;
        });

        // --- ABAS E RÁDIOS ---
        function switchView(view) {
            currentView = view;
            if (view === 'local') {
                DOM.tabLocal.classList.replace('text-gray-400', 'text-white'); DOM.tabLocal.classList.replace('bg-transparent', 'bg-emerald-600'); DOM.tabLocal.classList.add('shadow-sm');
                DOM.tabRadio.classList.replace('text-white', 'text-gray-400'); DOM.tabRadio.classList.replace('bg-emerald-600', 'bg-transparent'); DOM.tabRadio.classList.remove('shadow-sm');
                DOM.localActions.classList.remove('hidden'); DOM.sortSel.classList.remove('hidden'); DOM.localSearchWrap.classList.remove('hidden'); DOM.radioTunerWrap.classList.add('hidden'); DOM.radioTunerWrap.classList.remove('flex');
                DOM.listTitle.innerHTML = `<svg class="w-4 h-4 md:w-5 md:h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg> Sua Playlist`;
            } else {
                DOM.tabRadio.classList.replace('text-gray-400', 'text-white'); DOM.tabRadio.classList.replace('bg-transparent', 'bg-emerald-600'); DOM.tabRadio.classList.add('shadow-sm');
                DOM.tabLocal.classList.replace('text-white', 'text-gray-400'); DOM.tabLocal.classList.replace('bg-emerald-600', 'bg-transparent'); DOM.tabLocal.classList.remove('shadow-sm');
                DOM.localActions.classList.add('hidden'); DOM.sortSel.classList.add('hidden'); DOM.localSearchWrap.classList.add('hidden'); DOM.radioTunerWrap.classList.remove('hidden'); DOM.radioTunerWrap.classList.add('flex');
                DOM.listTitle.innerHTML = `<svg class="w-4 h-4 md:w-5 md:h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path></svg> Estações Registadas`;
                if(playingMode !== 'radio') { loadAudioEntity('radio', 0); } // Carrega a rádio inicial se entrar na tab sem tocar
            }
            renderList();
        }

        DOM.tabLocal.addEventListener('click', () => switchView('local'));
        DOM.tabRadio.addEventListener('click', () => switchView('radio'));

        function updateMainUIForMode() {
            if (playingMode === 'radio') {
                DOM.mainFav.classList.add('hidden'); DOM.progWrap.classList.add('radio-mode-progress'); DOM.progBar.value = 100; DOM.progFill.style.width = '100%'; DOM.curTime.textContent = 'AO VIVO'; DOM.totTime.textContent = 'STREAM';
            } else {
                DOM.progWrap.classList.remove('radio-mode-progress'); updateMainFavoriteIcon();
            }
        }

        function updateMainFavoriteIcon() {
            if(playlist.length===0){ DOM.mainFav.classList.add('hidden'); return; }
            DOM.mainFav.classList.remove('hidden'); const isFav = playlist[currentTrackIndex]?.favorite || false;
            DOM.mainFavIcon.setAttribute('fill', isFav ? 'currentColor' : 'none'); DOM.mainFavIcon.classList.toggle('text-red-500', isFav); DOM.mainFavIcon.classList.toggle('text-gray-300', !isFav);
        }

        function loadAudioEntity(mode, index, updateSlider = true) {
            playingMode = mode; audioLocal.pause(); audioRadio.pause(); let t;
            
            if (mode === 'radio') {
                if(index < 0) index = radioStations.length-1; if(index >= radioStations.length) index = 0;
                currentRadioIndex = index; t = radioStations[currentRadioIndex]; isTuned = true;
                audioRadio.src = t.src; DOM.cover.classList.remove('static-noise');
                if(updateSlider) { DOM.tunerSlider.value = t.freq; DOM.tunerDisp.textContent = t.freq; DOM.tunerStatus.innerHTML = '<span class="text-emerald-500 animate-pulse">● Sintonizado</span>'; }
            } else {
                if(playlist.length===0) return;
                if(index < 0) index = playlist.length-1; if(index >= playlist.length) index = 0;
                currentTrackIndex = index; t = playlist[currentTrackIndex]; DOM.cover.classList.remove('static-noise'); isTuned = true;
                if(t.isLocal) audioLocal.removeAttribute('crossorigin'); else audioLocal.setAttribute('crossorigin', 'anonymous'); audioLocal.src = t.src; 
            }

            DOM.title.textContent = t.title; DOM.artist.textContent = t.artist || t.genre;
            DOM.cover.src = t.cover || 'https://images.unsplash.com/photo-1614680376573-df3480f0c6ff?w=500&h=500&fit=crop';
            updateMainUIForMode(); renderList();
            if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, artwork: [{ src: DOM.cover.src, sizes: '500x500', type: 'image/jpeg' }]});
            
            if (isPlaying) { 
                const act = getActiveAudio(); const p = act.play(); 
                if(p!==undefined) p.then(()=>{ if(mode==='local'){ t.playCount=(t.playCount||0)+1; if(t.isLocal) saveTrackToDB(t); } }).catch(()=>{ isPlaying=false; DOM.playIcon.classList.remove('hidden'); DOM.pauseIcon.classList.add('hidden'); DOM.cover.classList.add('spin-paused'); }); 
            }
        }

        function togglePlay() {
            const act = getActiveAudio();
            if(playingMode==='local' && playlist.length===0) return; 
            if(playingMode==='local') { initWebAudio(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); }

            if(isPlaying) {
                act.pause(); DOM.playIcon.classList.remove('hidden'); DOM.pauseIcon.classList.add('hidden'); DOM.cover.classList.add('spin-paused'); isPlaying=false;
            } else { 
                // Se rádio não está sintonizada, "finge" tocar para mostrar a estática visual
                if (playingMode === 'radio' && !isTuned) { DOM.playIcon.classList.add('hidden'); DOM.pauseIcon.classList.remove('hidden'); DOM.cover.classList.remove('spin-paused'); isPlaying=true; return; }
                
                const p = act.play(); 
                if(p!==undefined) p.then(()=>{ 
                    DOM.playIcon.classList.add('hidden'); DOM.pauseIcon.classList.remove('hidden'); DOM.cover.classList.remove('spin-paused'); isPlaying=true; 
                    if(playingMode==='local'){ const t=playlist[currentTrackIndex]; t.playCount=(t.playCount||0)+1; if(t.isLocal)saveTrackToDB(t); } renderList(); 
                }).catch(()=>{ alert("Toque na tela antes do áudio."); isPlaying=false; }); 
                else { isPlaying=true; DOM.playIcon.classList.add('hidden'); DOM.pauseIcon.classList.remove('hidden'); DOM.cover.classList.remove('spin-paused'); renderList(); }
            }
        }

        function nextTrack() {
            if(playingMode === 'radio') { loadAudioEntity('radio', currentRadioIndex+1); if(!isPlaying) togglePlay(); }
            else { if(playlist.length===0) return; let nI = currentTrackIndex+1; if(isShuffle){ nI = Math.floor(Math.random()*playlist.length); if(nI===currentTrackIndex && playlist.length>1) nI=(nI+1)%playlist.length; } else if(nI>=playlist.length) nI=0; loadAudioEntity('local', nI); if(!isPlaying) togglePlay(); }
        }
        function prevTrack() {
            if(playingMode === 'radio') { loadAudioEntity('radio', currentRadioIndex-1); if(isPlaying && isTuned) getActiveAudio().play(); }
            else { loadAudioEntity('local', currentTrackIndex-1); if(isPlaying) getActiveAudio().play(); }
        }

        audioLocal.addEventListener('timeupdate', () => {
            if(playingMode !== 'local' || isNaN(audioLocal.duration)) return; 
            const pct = (audioLocal.currentTime/audioLocal.duration)*100; DOM.progBar.value = pct; DOM.progFill.style.width = pct+'%';
            const fT = s => `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; DOM.curTime.textContent = fT(audioLocal.currentTime); DOM.totTime.textContent = fT(audioLocal.duration);
        });
        DOM.progBar.addEventListener('input', e => { if(playingMode==='local') audioLocal.currentTime = (e.target.value*audioLocal.duration)/100; });
        
        DOM.volBar.addEventListener('input', e => { const v = e.target.value; audioLocal.volume = v; audioRadio.volume = v; DOM.volFill.style.width = v*100+'%'; const m = (v==0); audioLocal.muted = m; audioRadio.muted = m; localStorage.setItem('webPlayerVol', v); });
        DOM.mute.addEventListener('click', () => { const m = !audioLocal.muted; audioLocal.muted = m; audioRadio.muted = m; if(m){DOM.volBar.value=0; DOM.volFill.style.width='0%';}else{DOM.volBar.value=parseFloat(localStorage.getItem('webPlayerVol'))||0.5; DOM.volFill.style.width=DOM.volBar.value*100+'%';} });

        function updateCtrlBtns() { DOM.shuffle.classList.toggle('text-emerald-500', isShuffle); DOM.shuffle.classList.toggle('text-gray-300', !isShuffle); DOM.repeat.classList.toggle('text-emerald-500', isRepeat); DOM.repeat.classList.toggle('text-gray-300', !isRepeat); }
        DOM.shuffle.addEventListener('click', () => { isShuffle=!isShuffle; localStorage.setItem('webPlayerShuffle', isShuffle); updateCtrlBtns(); showToast(isShuffle?"Aleatório Ligado":"Aleatório Desligado"); });
        DOM.repeat.addEventListener('click', () => { isRepeat=!isRepeat; localStorage.setItem('webPlayerRepeat', isRepeat); updateCtrlBtns(); showToast(isRepeat?"Repetir Ligado":"Repetir Desligado"); });

        // --- ORDENAÇÃO E RENDERIZAÇÃO ---
        DOM.sortSel.addEventListener('change', e => { currentSortMode = e.target.value; sortPlaylistArray(); renderList(); showToast(e.target.value==='recent'?"Mais Recentes":"Mais Tocadas"); });
        DOM.search.addEventListener('input', () => renderList()); 

        function sortPlaylistArray() { if(playlist.length===0) return; const cT = playlist[currentTrackIndex]; if(currentSortMode==='most_played') playlist.sort((a,b)=>(b.playCount||0)-(a.playCount||0)); else playlist.sort((a,b)=>(b.addedAt||0)-(a.addedAt||0)); currentTrackIndex = playlist.indexOf(cT); }

        function renderList() {
            DOM.container.innerHTML = ''; const term = DOM.search.value.toLowerCase(); const isSearching = term.length > 0;

            if (currentView === 'radio') {
                radioStations.forEach((station, index) => {
                    const isActive = playingMode === 'radio' && isTuned && index === currentRadioIndex;
                    const item = document.createElement('div');
                    item.className = `flex items-center gap-2 sm:gap-3 p-2 sm:p-3 rounded-xl cursor-pointer transition mb-2 border ${isActive ? 'bg-emerald-500/10 border-emerald-500/30' : 'border-transparent hover:bg-gray-800'}`;
                    const playingBars = isActive && isPlaying ? `<div class="flex items-end gap-0.5 h-3 w-3 sm:h-4 sm:w-4 ml-1 mr-1 flex-shrink-0"><div class="w-[3px] sm:w-1 bg-emerald-500 animate-[bounce_1s_infinite_0ms] h-full"></div><div class="w-[3px] sm:w-1 bg-emerald-500 animate-[bounce_1s_infinite_200ms] h-2/3"></div><div class="w-[3px] sm:w-1 bg-emerald-500 animate-[bounce_1s_infinite_400ms] h-4/5"></div></div>` : ``;
                    
                    item.innerHTML = `
                        <div class="p-1 hidden sm:block"><span class="bg-gray-800 text-emerald-500 px-1.5 py-0.5 rounded text-[9px] font-mono border border-emerald-500/30">${station.freq}</span></div>
                        <img src="${station.cover}" crossorigin="anonymous" class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg object-cover shadow-md pointer-events-none flex-shrink-0 bg-gray-800">
                        <div class="flex-1 overflow-hidden pointer-events-none"><h4 class="text-xs sm:text-sm font-semibold truncate ${isActive?'text-emerald-400':'text-gray-200'}">${station.title}</h4><p class="text-[10px] sm:text-xs text-gray-500 truncate flex items-center">${station.artist}</p></div>
                        ${playingBars}
                    `;
                    item.addEventListener('click', () => { loadAudioEntity('radio', index); if(!isPlaying) togglePlay(); else getActiveAudio().play(); });
                    DOM.container.appendChild(item);
                });
            } else {
                playlist.forEach((track, index) => {
                    if(isSearching && !track.title.toLowerCase().includes(term) && !track.artist.toLowerCase().includes(term)) return;
                    const isActive = playingMode === 'local' && index === currentTrackIndex;
                    const item = document.createElement('div'); item.draggable = !isSearching; item.className = `playlist-item flex items-center gap-2 sm:gap-3 p-2 sm:p-3 rounded-xl cursor-pointer transition mb-2 border ${isActive ? 'bg-emerald-500/10 border-emerald-500/30' : 'border-transparent hover:bg-gray-800'}`;
                    
                    if(!isSearching) {
                        item.addEventListener('dragstart', e => { draggedItemIndex=index; e.dataTransfer.effectAllowed='move'; setTimeout(()=>item.classList.add('opacity-50'),0); });
                        item.addEventListener('dragend', () => { draggedItemIndex=null; item.classList.remove('opacity-50'); document.querySelectorAll('.playlist-item').forEach(el=>el.classList.remove('drag-over')); });
                        item.addEventListener('dragover', e => { e.preventDefault(); if(draggedItemIndex!==index) item.classList.add('drag-over'); });
                        item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
                        item.addEventListener('drop', e => {
                            e.preventDefault(); item.classList.remove('drag-over'); if(draggedItemIndex===null || draggedItemIndex===index) return;
                            const dT = playlist.splice(draggedItemIndex, 1)[0]; playlist.splice(index, 0, dT);
                            if(playingMode==='local') { if(currentTrackIndex===draggedItemIndex) currentTrackIndex=index; else if(draggedItemIndex<currentTrackIndex && index>=currentTrackIndex) currentTrackIndex--; else if(draggedItemIndex>currentTrackIndex && index<=currentTrackIndex) currentTrackIndex++; }
                            if(DOM.sortSel.value!=='recent'){ DOM.sortSel.value='recent'; currentSortMode='recent'; showToast("Ordem Manual"); } renderList();
                        });
                    }

                    const playingBars = isActive && isPlaying ? `<div class="flex items-end gap-0.5 h-3 w-3 sm:h-4 sm:w-4 ml-1 mr-1 flex-shrink-0"><div class="w-[3px] sm:w-1 bg-emerald-500 animate-[bounce_1s_infinite_0ms] h-full"></div><div class="w-[3px] sm:w-1 bg-emerald-500 animate-[bounce_1s_infinite_200ms] h-2/3"></div><div class="w-[3px] sm:w-1 bg-emerald-500 animate-[bounce_1s_infinite_400ms] h-4/5"></div></div>` : ``;
                    const favFill = track.favorite?'currentColor':'none'; const favColor = track.favorite?'text-red-500':'text-gray-400 hover:text-red-400';
                    const playsText = currentSortMode==='most_played'?`<span class="text-[9px] text-emerald-600 bg-emerald-500/10 px-1 rounded ml-1">${track.playCount||0} plays</span>`:'';

                    item.innerHTML = `
                        <div class="cursor-grab active:cursor-grabbing p-1 text-gray-500 hover:text-white transition flex-shrink-0 hidden sm:block"><svg class="w-4 h-4 pointer-events-none ${isSearching?'opacity-20':''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg></div>
                        <img src="${track.cover || 'https://images.unsplash.com/photo-1614680376573-df3480f0c6ff?w=100&h=100&fit=crop'}" crossorigin="anonymous" class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg object-cover shadow-md pointer-events-none flex-shrink-0 bg-gray-800">
                        <div class="flex-1 overflow-hidden pointer-events-none"><h4 class="text-xs sm:text-sm font-semibold truncate ${isActive?'text-emerald-400':'text-gray-200'}">${track.title}</h4><p class="text-[10px] sm:text-xs text-gray-500 truncate flex items-center">${track.artist} ${playsText}</p></div>
                        ${playingBars}
                        <div class="actions flex items-center gap-0 sm:gap-1 flex-shrink-0">
                            <button class="fav-btn p-1.5 sm:p-2 ${favColor} transition rounded-full hover:bg-gray-700" data-index="${index}"><svg class="w-4 h-4" fill="${favFill}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg></button>
                            <button class="del-btn p-1.5 sm:p-2 text-gray-400 hover:text-red-500 transition rounded-full hover:bg-gray-700" data-index="${index}"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                    `;
                    item.addEventListener('click', e => { if(e.target.closest('.actions')||e.target.closest('.cursor-grab')) return; loadAudioEntity('local', index); if(!isPlaying) togglePlay(); else getActiveAudio().play(); });
                    DOM.container.appendChild(item);
                });

                document.querySelectorAll('.fav-btn').forEach(btn => btn.addEventListener('click', e => {
                    e.stopPropagation(); const idx=parseInt(btn.dataset.index); playlist[idx].favorite=!playlist[idx].favorite;
                    if(playlist[idx].isLocal) saveTrackToDB(playlist[idx]); renderList(); if(idx===currentTrackIndex && playingMode==='local') updateMainFavoriteIcon(); showToast(playlist[idx].favorite?"Favorito":"Removido");
                }));
                document.querySelectorAll('.del-btn').forEach(btn => btn.addEventListener('click', e => {
                    e.stopPropagation(); const idx=parseInt(btn.dataset.index); const t=playlist[idx];
                    if(t.isLocal && t.id) deleteTrackFromDB(t.id); playlist.splice(idx,1); showToast("Excluída");
                    if(playlist.length===0){ 
                        if(playingMode==='local') { audioLocal.pause(); audioLocal.src=''; isPlaying=false; DOM.playIcon.classList.remove('hidden'); DOM.pauseIcon.classList.add('hidden'); DOM.cover.classList.add('spin-paused'); DOM.title.textContent='Playlist Vazia'; DOM.artist.textContent='Adicione músicas'; DOM.progBar.value=0; DOM.progFill.style.width='0%'; DOM.curTime.textContent='0:00'; DOM.totTime.textContent='0:00'; updateMainFavoriteIcon(); if('mediaSession' in navigator)navigator.mediaSession.metadata=null; DOM.playerBg.style.background = ''; }
                    } else { if(playingMode==='local') { if(idx===currentTrackIndex){ currentTrackIndex=idx>=playlist.length?0:idx; loadAudioEntity('local', currentTrackIndex); }else if(idx<currentTrackIndex) currentTrackIndex--; } } renderList();
                }));
            }
        }

        // --- UPLOAD ---
        function handleFiles(files) {
            if(files.length === 0) return; switchView('local'); let loadedCount = 0; let added = 0; showToast(`Lendo ${files.length} arquivo(s)...`);
            files.forEach(file => {
                if (file.type.startsWith('audio/') || file.name.endsWith('.mp3') || file.name.endsWith('.wav') || file.name.endsWith('.m4a')) {
                    const cleanTitle = file.name.replace(/\.[^/.]+$/, ""); const trackId = 'local_'+Date.now()+'_'+Math.floor(Math.random()*1000);
                    let nT = { id: trackId, title: cleanTitle, artist: "Desconhecido", file: file, src: null, cover: null, favorite: false, isLocal: true, addedAt: Date.now(), playCount: 0 };
                    const finish = () => { nT.src = URL.createObjectURL(file); playlist.unshift(nT); saveTrackToDB(nT); loadedCount++; added++;
                        if(loadedCount === files.length) { if(currentTrackIndex > 0 || playlist.length > added) currentTrackIndex += added; sortPlaylistArray(); renderList(); showToast(`${added} importada(s)`); if(!isPlaying && added === playlist.length) loadAudioEntity('local', 0); }
                    };
                    if (window.jsmediatags) {
                        window.jsmediatags.read(file, { onSuccess: tag => { if(tag.tags.title) nT.title = tag.tags.title; if(tag.tags.artist) nT.artist = tag.tags.artist; if(tag.tags.picture) { let b64 = ""; for (let i=0; i<tag.tags.picture.data.length; i++) b64 += String.fromCharCode(tag.tags.picture.data[i]); nT.cover = `data:${tag.tags.picture.format};base64,${window.btoa(b64)}`; } finish(); }, onError: () => finish() });
                    } else finish();
                } else { loadedCount++; if(loadedCount===files.length && added>0) { sortPlaylistArray(); renderList(); showToast(`${added} importada(s)`); } }
            });
        }
        DOM.fileUpload.addEventListener('change', e => handleFiles(Array.from(e.target.files)));
        DOM.folderUpload.addEventListener('change', e => handleFiles(Array.from(e.target.files)));

        // --- BOTÕES, TECLADO E ARRANQUE ---
        DOM.playPause.addEventListener('click', () => { togglePlay(); DOM.playPause.blur(); });
        DOM.next.addEventListener('click', () => { nextTrack(); DOM.next.blur(); });
        DOM.prev.addEventListener('click', () => { prevTrack(); DOM.prev.blur(); });

        audioLocal.addEventListener('ended', () => { if(isRepeat){audioLocal.currentTime=0; audioLocal.play();}else nextTrack(); });
        document.addEventListener('keydown', e => {
            if(e.target.tagName === 'INPUT') return; if(e.target.tagName === 'BUTTON' && e.code === 'Space') e.preventDefault(); 
            switch(e.code) { 
                case 'Space': e.preventDefault(); togglePlay(); break; 
                case 'ArrowRight': e.preventDefault(); nextTrack(); break; 
                case 'ArrowLeft': e.preventDefault(); prevTrack(); break; 
                case 'ArrowUp': e.preventDefault(); DOM.volBar.value=Math.min(1,parseFloat(DOM.volBar.value)+0.1); DOM.volBar.dispatchEvent(new Event('input')); break; 
                case 'ArrowDown': e.preventDefault(); DOM.volBar.value=Math.max(0,parseFloat(DOM.volBar.value)-0.1); DOM.volBar.dispatchEvent(new Event('input')); break; 
            }
        });
        
        updateCtrlBtns();
        initDB().then(async () => {
            await loadTracksFromDB(); sortPlaylistArray(); renderList();
            if(playlist.length>0) loadAudioEntity('local', 0); else { DOM.title.textContent='Playlist Vazia'; DOM.artist.textContent='Adicione músicas'; }
        });
        const initVol = parseFloat(localStorage.getItem('webPlayerVol'));
        if(!isNaN(initVol)){ audioLocal.volume=initVol; audioRadio.volume=initVol; DOM.volBar.value=initVol; DOM.volFill.style.width=initVol*100+'%'; audioLocal.muted=(initVol===0); audioRadio.muted=(initVol===0); } else { audioLocal.volume=1; audioRadio.volume=1; }

        // --- PWA ---
        const manifest = { name: "Emera Player", short_name: "Emera", start_url: ".", display: "standalone", background_color: "#111827", theme_color: "#10b981", icons: [{ src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3'/></svg>", sizes: "192x192 512x512", type: "image/svg+xml", purpose: "any maskable" }]};
        const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'})); document.head.appendChild(link);
        const swUrl = URL.createObjectURL(new Blob([`self.addEventListener('install', (e)=>self.skipWaiting()); self.addEventListener('activate', (e)=>self.clients.claim()); self.addEventListener('fetch', (e)=>{});`], {type: 'application/javascript'}));
        if ('serviceWorker' in navigator) navigator.serviceWorker.register(swUrl).catch(()=>{});
        let deferredPrompt; const installBtn = document.getElementById('install-app-btn');
        window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt=e; installBtn.classList.remove('hidden'); });
        installBtn.addEventListener('click', async () => { if(deferredPrompt){deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; installBtn.classList.add('hidden');} });
        window.addEventListener('appinstalled', () => { installBtn.classList.add('hidden'); deferredPrompt=null; });
    </script>
</body>
</html>
