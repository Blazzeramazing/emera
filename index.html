    <!-- Importando jsmediatags para extrair metadados (ID3) de MP3 locais -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    
    <!-- Polyfill para Drag and Drop funcionar no Mobile (Touchscreens) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>

    <!-- Importando Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos personalizados para a barra de progresso (Range Slider) */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            margin-top: -4px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #374151;
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
        .progress-bar-container {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }
        .progress-fill {
            position: absolute;
            height: 4px;
            background: #10b981;
            border-radius: 2px;
            pointer-events: none;
            top: 50%;
            transform: translateY(-50%);
            left: 0;
            width: 0%;
        }
        
        /* Animações */
        .spin-slow { animation: spin 8s linear infinite; }
        .spin-paused { animation-play-state: paused; }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        @media (min-width: 768px) { .custom-scrollbar::-webkit-scrollbar { width: 6px; } }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 20px; }
        
        /* Equalizador */
        input[type=range][orient=vertical] {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 8px;
            height: 100%;
            padding: 0 5px;
            cursor: pointer;
        }
        .drag-over {
            border: 2px dashed #10b981 !important;
            background-color: rgba(16, 185, 129, 0.1) !important;
        }
        @media (min-width: 768px) {
            .playlist-item .actions { opacity: 0; transition: opacity 0.2s; }
            .playlist-item:hover .actions { opacity: 1; }
        }

        /* Toasts (Notificações) */
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .toast-exit-active { transform: translateY(100%); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>

    <script>
        // --- FUNÇÕES DE TOAST (NOTIFICAÇÃO) ---
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast-enter bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-[0_4px_15px_rgba(16,185,129,0.3)] text-xs sm:text-sm flex items-center gap-3 font-medium pointer-events-auto';
            toast.innerHTML = `
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                ${message}
            `;
            
            const container = document.getElementById('toast-container');
            container.appendChild(toast);
            
            // Ativar animação de entrada
            requestAnimationFrame(() => {
                toast.classList.replace('toast-enter', 'toast-enter-active');
            });
            
            setTimeout(() => {
                toast.classList.replace('toast-enter-active', 'toast-exit-active');
                setTimeout(() => toast.remove(), 300); // Aguarda transição CSS
            }, 3000);
        }

        // --- BASE DE DADOS (INDEXEDDB) ---
        const DB_NAME = "MusicPlayerDB";
        const STORE_NAME = "local_tracks";
        let db;

        function initDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onerror = (e) => resolve(null);
                request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: "id" });
                };
            });
        }

        function saveTrackToDB(track) {
            if (!db) return;
            const trackToSave = { ...track };
            delete trackToSave.src;
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).put(trackToSave);
        }

        function deleteTrackFromDB(id) {
            if (!db) return;
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).delete(id);
        }

        function loadTracksFromDB() {
            if (!db) return Promise.resolve();
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const request = tx.objectStore(STORE_NAME).getAll();
                request.onsuccess = () => {
                    const tracks = request.result;
                    tracks.forEach(t => {
                        t.src = URL.createObjectURL(t.file);
                        t.playCount = t.playCount || 0; // Inicia estatística
                        t.addedAt = t.addedAt || Date.now();
                        playlist.push(t);
                    });
                    resolve();
                };
                request.onerror = () => resolve();
            });
        }

        // --- ESTADO DA APLICAÇÃO ---
        const audio = document.getElementById('audio-player');
        let isPlaying = false;
        let currentTrackIndex = 0;
        let currentSortMode = 'recent'; // 'recent' ou 'most_played'
        
        let isShuffle = JSON.parse(localStorage.getItem('webPlayerShuffle')) || false;
        let isRepeat = JSON.parse(localStorage.getItem('webPlayerRepeat')) || false;
        const savedEq = JSON.parse(localStorage.getItem('webPlayerEq')) || [0, 0, 0, 0, 0];
        
        let audioCtx, sourceNode, analyser;
        let eqFilters = [];
        const eqFrequencies = [60, 230, 910, 3600, 14000];

        let draggedItemIndex = null;
        let playlist = [];

        // --- DOM ---
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const coverArt = document.getElementById('cover-art');
        const mainFavoriteBtn = document.getElementById('main-favorite-btn');
        const mainFavIcon = document.getElementById('main-fav-icon');
        
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const volumeBar = document.getElementById('volume-bar');
        const volFill = document.getElementById('vol-fill');
        
        const playlistContainer = document.getElementById('playlist-container');
        const fileUpload = document.getElementById('file-upload');
        const sortSelect = document.getElementById('sort-select');
        
        const eqBtn = document.getElementById('eq-btn');
        const eqModal = document.getElementById('eq-modal');
        const closeEqBtn = document.getElementById('close-eq-btn');
        const resetEqBtn = document.getElementById('reset-eq-btn');
        const eqBandsContainer = document.getElementById('eq-bands-container');
        const canvasVisualizer = document.getElementById('visualizer');
        const canvasCtx = canvasVisualizer.getContext('2d');

        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const clearDbBtn = document.getElementById('clear-db-btn');

        // --- EQUALIZADOR E ÁUDIO (iOS Fix) ---
        function initWebAudio() {
            if (audioCtx) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                sourceNode = audioCtx.createMediaElementSource(audio);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;

                let prevNode = sourceNode;
                eqFrequencies.forEach((freq, index) => {
                    let filter = audioCtx.createBiquadFilter();
                    filter.type = index === 0 ? 'lowshelf' : (index === eqFrequencies.length - 1 ? 'highshelf' : 'peaking');
                    filter.frequency.value = freq;
                    filter.gain.value = savedEq[index] || 0; 
                    if(filter.type === 'peaking') filter.Q.value = 1;
                    
                    eqFilters.push(filter);
                    prevNode.connect(filter);
                    prevNode = filter;
                });
                
                prevNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                drawVisualizer(); 
            } catch (e) { console.warn("Audio API bloqueada.", e); }
        }

        let audioUnlocked = false;
        function unlockAudio() {
            if (audioUnlocked) return;
            initWebAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            audio.load(); 
            audioUnlocked = true;
            document.body.removeEventListener('touchstart', unlockAudio);
            document.body.removeEventListener('click', unlockAudio);
        }
        document.body.addEventListener('touchstart', unlockAudio, { once: true });
        document.body.addEventListener('click', unlockAudio, { once: true });

        if (window.MobileDragDrop) {
            MobileDragDrop.polyfill({ dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride });
        }
        window.addEventListener('touchmove', function() {}, {passive: false});

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!analyser || !isPlaying) return; 

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            const width = canvasVisualizer.clientWidth;
            const height = canvasVisualizer.clientHeight;
            if(canvasVisualizer.width !== width || canvasVisualizer.height !== height) {
                canvasVisualizer.width = width; canvasVisualizer.height = height;
            }
            canvasCtx.clearRect(0, 0, width, height);
            
            const centerX = width / 2; const centerY = height / 2; const radius = width / 2;
            for (let i = 0; i < bufferLength; i++) {
                const barHeight = dataArray[i] / 2;
                if (barHeight === 0) continue;
                const angle = (i / bufferLength) * Math.PI * 2;
                const x = centerX + Math.cos(angle) * (radius - barHeight);
                const y = centerY + Math.sin(angle) * (radius - barHeight);
                const xEnd = centerX + Math.cos(angle) * radius;
                const yEnd = centerY + Math.sin(angle) * radius;
                
                canvasCtx.beginPath();
                canvasCtx.moveTo(x, y); canvasCtx.lineTo(xEnd, yEnd);
                canvasCtx.lineWidth = 4;
                canvasCtx.strokeStyle = `rgba(16, 185, 129, ${dataArray[i]/255})`; 
                canvasCtx.stroke();
            }
        }

        // Sliders de EQ
        eqFrequencies.forEach((freq, index) => {
            const col = document.createElement('div');
            col.className = 'flex flex-col items-center h-full';
            const slider = document.createElement('input');
            slider.type = 'range'; slider.setAttribute('orient', 'vertical');
            slider.min = -12; slider.max = 12; slider.step = 0.5;
            slider.value = savedEq[index] || 0;
            slider.className = 'flex-1 accent-emerald-500 cursor-pointer w-full max-w-[20px]';
            
            slider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                if(eqFilters[index]) eqFilters[index].gain.value = val;
                savedEq[index] = val;
                localStorage.setItem('webPlayerEq', JSON.stringify(savedEq));
            });
            
            const label = document.createElement('span');
            label.className = 'text-[9px] sm:text-[11px] text-gray-400 mt-2 sm:mt-3 font-mono font-bold';
            label.textContent = freq >= 1000 ? (freq/1000)+'k' : freq;
            col.appendChild(slider); col.appendChild(label);
            eqBandsContainer.appendChild(col);
        });

        // Eventos dos Presets do EQ
        document.querySelectorAll('.eq-preset-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const preset = e.target.dataset.preset.split(',').map(Number);
                const sliders = eqBandsContainer.querySelectorAll('input[type=range]');
                sliders.forEach((slider, i) => {
                    slider.value = preset[i];
                    if(eqFilters[i]) eqFilters[i].gain.value = preset[i];
                    savedEq[i] = preset[i];
                });
                localStorage.setItem('webPlayerEq', JSON.stringify(savedEq));
                showToast(`Preset: ${e.target.textContent} ativo`);
            });
        });

        // Modais
        const toggleModal = (modal, show) => {
            if(show) { modal.classList.remove('hidden'); setTimeout(() => modal.classList.remove('opacity-0'), 10); } 
            else { modal.classList.add('opacity-0'); setTimeout(() => modal.classList.add('hidden'), 300); }
        };
        eqBtn.addEventListener('click', () => toggleModal(eqModal, true));
        closeEqBtn.addEventListener('click', () => toggleModal(eqModal, false));
        settingsBtn.addEventListener('click', () => toggleModal(settingsModal, true));
        closeSettingsBtn.addEventListener('click', () => toggleModal(settingsModal, false));

        resetEqBtn.addEventListener('click', () => {
            eqBandsContainer.querySelectorAll('input[type=range]').forEach((slider, i) => {
                slider.value = 0;
                if(eqFilters[i]) eqFilters[i].gain.value = 0;
                savedEq[i] = 0;
            });
            localStorage.setItem('webPlayerEq', JSON.stringify(savedEq));
            showToast("Equalizador resetado");
        });

        // Ação Limpar Dados
        clearDbBtn.addEventListener('click', () => {
            if(confirm("Tem a certeza que deseja apagar todas as músicas e configurações? Esta ação é irreversível.")) {
                localStorage.clear();
                const request = indexedDB.deleteDatabase(DB_NAME);
                request.onsuccess = () => window.location.reload();
                request.onerror = () => window.location.reload();
            }
        });

        // --- LÓGICA DO PLAYER ---
        function updateMainFavoriteIcon() {
            if(playlist.length === 0) { mainFavoriteBtn.classList.add('hidden'); return; }
            mainFavoriteBtn.classList.remove('hidden');
            const isFav = playlist[currentTrackIndex]?.favorite || false;
            mainFavIcon.setAttribute('fill', isFav ? 'currentColor' : 'none');
            mainFavIcon.classList.toggle('text-red-500', isFav);
            mainFavIcon.classList.toggle('text-gray-500', !isFav);
        }

        mainFavoriteBtn.addEventListener('click', () => {
            if(playlist.length > 0) {
                const track = playlist[currentTrackIndex];
                track.favorite = !track.favorite;
                updateMainFavoriteIcon();
                if (track.isLocal && track.id) saveTrackToDB(track);
                renderPlaylist();
                showToast(track.favorite ? "Adicionado aos Favoritos" : "Removido dos Favoritos");
            }
        });

        function updateMediaSession(track) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title, artist: track.artist,
                    artwork: [{ src: track.cover || 'https://images.unsplash.com/photo-1614680376573-df3480f0c6ff?w=500&h=500&fit=crop', sizes: '500x500', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
                navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
                navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
            }
        }

        function loadTrack(index) {
            if(playlist.length === 0) return;
            if (index < 0) index = playlist.length - 1;
            if (index >= playlist.length) index = 0;
            
            currentTrackIndex = index;
            const track = playlist[currentTrackIndex];
            
            if (track.isLocal) audio.removeAttribute('crossorigin');
            else audio.setAttribute('crossorigin', 'anonymous');

            audio.src = track.src;
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            coverArt.src = track.cover || 'https://images.unsplash.com/photo-1614680376573-df3480f0c6ff?w=500&h=500&fit=crop';
            progressBar.value = 0; progressFill.style.width = '0%';
            
            updateMainFavoriteIcon(); updateMediaSession(track); renderPlaylist();

            if (isPlaying) {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        // Incrementar contador de "Plays" para estatística
                        track.playCount = (track.playCount || 0) + 1;
                        if (track.isLocal && track.id) saveTrackToDB(track);
                    }).catch(e => {
                        isPlaying = false;
                        playIcon.classList.remove('hidden'); pauseIcon.classList.add('hidden');
                        coverArt.classList.add('spin-paused');
                    });
                }
            }
        }

        function togglePlay() {
            if(playlist.length === 0) return;
            initWebAudio();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                audio.pause();
                playIcon.classList.remove('hidden'); pauseIcon.classList.add('hidden');
                coverArt.classList.add('spin-paused');
                isPlaying = false;
            } else {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        playIcon.classList.add('hidden'); pauseIcon.classList.remove('hidden');
                        coverArt.classList.remove('spin-paused');
                        isPlaying = true;
                        
                        // Incrementar ao dar play
                        const track = playlist[currentTrackIndex];
                        track.playCount = (track.playCount || 0) + 1;
                        if (track.isLocal && track.id) saveTrackToDB(track);
                        
                        renderPlaylist(); 
                    }).catch(e => {
                        alert("Toque na tela antes de iniciar o áudio (política do navegador).");
                    });
                }
            }
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            let nextIndex = currentTrackIndex + 1;
            if (isShuffle) {
                nextIndex = Math.floor(Math.random() * playlist.length);
                if (nextIndex === currentTrackIndex && playlist.length > 1) nextIndex = (nextIndex + 1) % playlist.length; 
            } else if (nextIndex >= playlist.length) nextIndex = 0;
            loadTrack(nextIndex);
            if(!isPlaying) togglePlay(); // Forçar toque
        }

        function prevTrack() {
            loadTrack(currentTrackIndex - 1);
            if(isPlaying) audio.play();
        }

        audio.addEventListener('timeupdate', () => {
            if (isNaN(audio.duration)) return;
            const progressPercent = (audio.currentTime / audio.duration) * 100;
            progressBar.value = progressPercent; progressFill.style.width = `${progressPercent}%`;
            
            const formatTime = (secs) => `${Math.floor(secs / 60)}:${Math.floor(secs % 60).toString().padStart(2, '0')}`;
            currentTimeEl.textContent = formatTime(audio.currentTime);
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        progressBar.addEventListener('input', e => audio.currentTime = (e.target.value * audio.duration) / 100);
        
        volumeBar.addEventListener('input', e => {
            audio.volume = e.target.value; volFill.style.width = `${e.target.value * 100}%`;
            audio.muted = (e.target.value == 0);
            localStorage.setItem('webPlayerVol', e.target.value);
        });

        document.getElementById('mute-btn').addEventListener('click', () => {
            audio.muted = !audio.muted;
            if(audio.muted) { volumeBar.value = 0; volFill.style.width = '0%'; } 
            else {
                volumeBar.value = parseFloat(localStorage.getItem('webPlayerVol')) || 0.5;
                volFill.style.width = `${volumeBar.value * 100}%`;
            }
        });

        function updateControlButtons() {
            shuffleBtn.classList.toggle('text-emerald-500', isShuffle); shuffleBtn.classList.toggle('text-gray-500', !isShuffle);
            repeatBtn.classList.toggle('text-emerald-500', isRepeat); repeatBtn.classList.toggle('text-gray-500', !isRepeat);
        }
        shuffleBtn.addEventListener('click', () => { isShuffle = !isShuffle; localStorage.setItem('webPlayerShuffle', isShuffle); updateControlButtons(); showToast(isShuffle ? "Modo Aleatório Ligado" : "Modo Aleatório Desligado"); });
        repeatBtn.addEventListener('click', () => { isRepeat = !isRepeat; localStorage.setItem('webPlayerRepeat', isRepeat); updateControlButtons(); showToast(isRepeat ? "Modo Repetir Ligado" : "Modo Repetir Desligado"); });

        // --- ORDENAÇÃO E RENDERIZAÇÃO DA PLAYLIST ---
        
        sortSelect.addEventListener('change', (e) => {
            currentSortMode = e.target.value;
            sortPlaylistArray();
            renderPlaylist();
            showToast(currentSortMode === 'recent' ? "Ordem: Mais Recentes" : "Ordem: Mais Tocadas");
        });

        function sortPlaylistArray() {
            if (playlist.length === 0) return;
            const currentTrack = playlist[currentTrackIndex]; // Guardar a música atual
            
            if (currentSortMode === 'most_played') {
                playlist.sort((a, b) => (b.playCount || 0) - (a.playCount || 0));
            } else {
                // Modo Recentes (Maior timestamp primeiro)
                playlist.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
            }
            
            // Reajustar o currentTrackIndex para apontar para a música que estava a tocar
            currentTrackIndex = playlist.indexOf(currentTrack);
        }

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            
            playlist.forEach((track, index) => {
                const isActive = index === currentTrackIndex;
                const item = document.createElement('div');
                item.draggable = true;
                item.className = `playlist-item flex items-center gap-2 sm:gap-3 p-2 sm:p-3 rounded-xl cursor-pointer transition mb-2 border ${isActive ? 'bg-emerald-500/10 border-emerald-500/30' : 'border-transparent hover:bg-gray-800'}`;
                
                // Drag and Drop
                item.addEventListener('dragstart', (e) => { draggedItemIndex = index; e.dataTransfer.effectAllowed = 'move'; setTimeout(() => item.classList.add('opacity-50'), 0); });
                item.addEventListener('dragend', () => { draggedItemIndex = null; item.classList.remove('opacity-50'); document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('drag-over')); });
                item.addEventListener('dragover', (e) => { e.preventDefault(); if(draggedItemIndex !== index) item.classList.add('drag-over'); });
                item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
                item.addEventListener('drop', (e) => {
                    e.preventDefault(); item.classList.remove('drag-over');
                    if (draggedItemIndex === null || draggedItemIndex === index) return;
                    
                    const draggedTrack = playlist.splice(draggedItemIndex, 1)[0];
                    playlist.splice(index, 0, draggedTrack);
                    
                    if (currentTrackIndex === draggedItemIndex) currentTrackIndex = index;
                    else if (draggedItemIndex < currentTrackIndex && index >= currentTrackIndex) currentTrackIndex--;
                    else if (draggedItemIndex > currentTrackIndex && index <= currentTrackIndex) currentTrackIndex++;
                    
                    // Se foi reordenado manualmente, resetamos o filtro para Padrão para não confundir
                    if(sortSelect.value !== 'recent') {
                        sortSelect.value = 'recent';
                        currentSortMode = 'recent';
                        showToast("Ordem Manual aplicada");
                    }
                    renderPlaylist();
                });

                const playingBars = isActive && isPlaying ? `
                    <div class="flex items-end gap-0.5 h-3 w-3 sm:h-4 sm:w-4 ml-1 mr-1 flex-shrink-0">
                        <div class="w-[3px] sm:w-1 bg-emerald-500 animate-[bounce_1s_infinite_0ms] h-full"></div>
                        <div class="w-[3px] sm:w-1 bg-emerald-500 animate-[bounce_1s_infinite_200ms] h-2/3"></div>
                        <div class="w-[3px] sm:w-1 bg-emerald-500 animate-[bounce_1s_infinite_400ms] h-4/5"></div>
                    </div>
                ` : ``;

                const favFill = track.favorite ? 'currentColor' : 'none';
                const favColor = track.favorite ? 'text-red-500' : 'text-gray-400 hover:text-red-400';
                const playsText = currentSortMode === 'most_played' ? `<span class="text-[9px] text-emerald-600 bg-emerald-500/10 px-1 rounded ml-1">${track.playCount||0} plays</span>` : '';

                item.innerHTML = `
                    <div class="cursor-grab active:cursor-grabbing p-1 text-gray-500 hover:text-white transition flex-shrink-0 hidden sm:block">
                        <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
                    </div>
                    <img src="${track.cover || 'https://images.unsplash.com/photo-1614680376573-df3480f0c6ff?w=100&h=100&fit=crop'}" class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg object-cover shadow-md pointer-events-none flex-shrink-0">
                    <div class="flex-1 overflow-hidden pointer-events-none">
                        <h4 class="text-xs sm:text-sm font-semibold truncate ${isActive ? 'text-emerald-400' : 'text-gray-200'}">${track.title}</h4>
                        <p class="text-[10px] sm:text-xs text-gray-500 truncate flex items-center">${track.artist} ${playsText}</p>
                    </div>
                    ${playingBars}
                    <div class="actions flex items-center gap-0 sm:gap-1 flex-shrink-0">
                        <button class="fav-btn p-1.5 sm:p-2 ${favColor} transition rounded-full hover:bg-gray-700" data-index="${index}">
                            <svg class="w-4 h-4" fill="${favFill}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        </button>
                        <button class="del-btn p-1.5 sm:p-2 text-gray-400 hover:text-red-500 transition rounded-full hover:bg-gray-700" data-index="${index}">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `;
                
                item.addEventListener('click', (e) => {
                    if(e.target.closest('.actions') || e.target.closest('.cursor-grab')) return;
                    loadTrack(index);
                    if(!isPlaying) togglePlay(); else audio.play();
                });
                playlistContainer.appendChild(item);
            });

            document.querySelectorAll('.fav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.index);
                    playlist[idx].favorite = !playlist[idx].favorite;
                    if (playlist[idx].isLocal) saveTrackToDB(playlist[idx]);
                    renderPlaylist();
                    if (idx === currentTrackIndex) updateMainFavoriteIcon();
                    showToast(playlist[idx].favorite ? "Adicionado aos Favoritos" : "Removido");
                });
            });

            document.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.index);
                    const trackToRemove = playlist[idx];
                    
                    if (trackToRemove.isLocal && trackToRemove.id) deleteTrackFromDB(trackToRemove.id);
                    playlist.splice(idx, 1);
                    showToast("Música excluída");
                    
                    if (playlist.length === 0) {
                        audio.pause(); audio.src = ''; isPlaying = false;
                        playIcon.classList.remove('hidden'); pauseIcon.classList.add('hidden');
                        coverArt.classList.add('spin-paused');
                        trackTitle.textContent = 'Playlist Vazia'; trackArtist.textContent = 'Adicione músicas';
                        progressBar.value = 0; progressFill.style.width = '0%';
                        currentTimeEl.textContent = '0:00'; totalTimeEl.textContent = '0:00';
                        updateMainFavoriteIcon();
                        if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
                    } else {
                        if (idx === currentTrackIndex) {
                            currentTrackIndex = idx >= playlist.length ? 0 : idx;
                            loadTrack(currentTrackIndex);
                        } else if (idx < currentTrackIndex) currentTrackIndex--;
                    }
                    renderPlaylist();
                });
            });
        }

        // --- UPLOAD E LEITURA DE MP3 ---
        fileUpload.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;
            
            let loadedCount = 0;

            files.forEach(file => {
                if (file.type.startsWith('audio/') || file.name.endsWith('.mp3')) {
                    const cleanTitle = file.name.replace(/\.[^/.]+$/, ""); 
                    const trackId = 'local_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

                    let newTrack = {
                        id: trackId, title: cleanTitle, artist: "Desconhecido",
                        file: file, src: null, cover: null, favorite: false,
                        isLocal: true, addedAt: Date.now(), playCount: 0
                    };
                    
                    const finalizeAndSave = () => {
                        newTrack.src = URL.createObjectURL(file);
                        playlist.push(newTrack);
                        saveTrackToDB(newTrack); 
                        loadedCount++;
                        
                        if (loadedCount === files.length) {
                            sortPlaylistArray(); // Respeita o modo de ordenação atual
                            renderPlaylist();
                            showToast(`${loadedCount} música(s) importada(s)`);
                            if (!isPlaying && playlist.length === loadedCount) loadTrack(0);
                        }
                    };

                    if (window.jsmediatags) {
                        window.jsmediatags.read(file, {
                            onSuccess: function(tag) {
                                const tags = tag.tags;
                                if(tags.title) newTrack.title = tags.title;
                                if(tags.artist) newTrack.artist = tags.artist;
                                if(tags.picture) {
                                    const data = tags.picture.data;
                                    let base64String = "";
                                    for (let i = 0; i < data.length; i++) base64String += String.fromCharCode(data[i]);
                                    newTrack.cover = `data:${tags.picture.format};base64,${window.btoa(base64String)}`;
                                }
                                finalizeAndSave();
                            },
                            onError: () => finalizeAndSave()
                        });
                    } else finalizeAndSave();
                } else {
                    loadedCount++; // Ignore non-audio files properly in count
                }
            });
        });

        // --- TECLADO E EVENTOS GERAIS ---
        playPauseBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);
        
        audio.addEventListener('ended', () => { if (isRepeat) { audio.currentTime = 0; audio.play(); } else nextTrack(); });
        document.addEventListener('keydown', (e) => {
            if (['INPUT', 'BUTTON'].includes(e.target.tagName)) return;
            switch(e.code) {
                case 'Space': e.preventDefault(); togglePlay(); break;
                case 'ArrowRight': e.preventDefault(); nextTrack(); break;
                case 'ArrowLeft': e.preventDefault(); prevTrack(); break;
                case 'ArrowUp': e.preventDefault(); volumeBar.value = Math.min(1, parseFloat(volumeBar.value) + 0.1); volumeBar.dispatchEvent(new Event('input')); break;
                case 'ArrowDown': e.preventDefault(); volumeBar.value = Math.max(0, parseFloat(volumeBar.value) - 0.1); volumeBar.dispatchEvent(new Event('input')); break;
            }
        });

        // --- ARRANQUE INICIAL ---
        updateControlButtons();
        
        initDB().then(async () => {
            await loadTracksFromDB();
            sortPlaylistArray(); // Garante a ordenação inicial correta (Mais Recentes no topo)
            renderPlaylist();
            if(playlist.length > 0) loadTrack(0);
            else { trackTitle.textContent = 'Playlist Vazia'; trackArtist.textContent = 'Adicione músicas para começar'; }
        });
        
        const initVol = parseFloat(localStorage.getItem('webPlayerVol'));
        if (!isNaN(initVol)) {
            audio.volume = initVol; volumeBar.value = initVol;
            volFill.style.width = `${initVol * 100}%`; audio.muted = (initVol === 0);
        } else audio.volume = 1;

        // --- PWA: CONFIGURAÇÃO ---
        const manifest = {
            name: "Emera Player", short_name: "Emera", start_url: ".", display: "standalone",
            background_color: "#111827", theme_color: "#10b981",
            icons: [{ src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3'/></svg>", sizes: "192x192 512x512", type: "image/svg+xml", purpose: "any maskable" }]
        };
        const link = document.createElement('link'); link.rel = 'manifest';
        link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'}));
        document.head.appendChild(link);

        const swUrl = URL.createObjectURL(new Blob([`self.addEventListener('install', (e) => self.skipWaiting()); self.addEventListener('activate', (e) => self.clients.claim()); self.addEventListener('fetch', (e) => {});`], {type: 'application/javascript'}));
        if ('serviceWorker' in navigator) navigator.serviceWorker.register(swUrl).catch(e => console.log('SW falhou'));

        let deferredPrompt; const installBtn = document.getElementById('install-app-btn');
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.classList.remove('hidden'); });
        installBtn.addEventListener('click', async () => { if(deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; installBtn.classList.add('hidden'); } });
        window.addEventListener('appinstalled', () => { installBtn.classList.add('hidden'); deferredPrompt = null; });
    </script>
</body>
</html>
