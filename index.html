<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emera Player</title>
    <!-- Favicon dinâmico (injetado via JS consoante o tema) -->
    <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="">
    
    <!-- JS Media Tags -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <!-- Polyfill Drag and Drop -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
    
    <!-- Configuração Dinâmica Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: 'var(--accent)',
                        accentHover: 'var(--accent-hover)',
                        accentLight: 'var(--accent-light)',
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            /* Tema Padrão (Esmeralda) */
            --accent: #10b981;
            --accent-hover: #059669;
            --accent-light: rgba(16, 185, 129, 0.2);
        }

        /* Sliders Padrão */
        .standard-slider { -webkit-appearance: none; width: 100%; background: transparent; }
        .standard-slider::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; margin-top: -4px; box-shadow: 0 0 10px var(--accent-light); transition: transform 0.1s; }
        .standard-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }
        .standard-slider::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #374151; border-radius: 2px; }
        .standard-slider:focus { outline: none; }
        
        .progress-bar-container { position: relative; width: 100%; display: flex; align-items: center; }
        .progress-fill { position: absolute; height: 4px; background: var(--accent); border-radius: 2px; pointer-events: none; top: 50%; transform: translateY(-50%); left: 0; width: 0%; transition: background 0.3s; }
        
        .spin-slow { animation: spin 8s linear infinite; }
        .spin-paused { animation-play-state: paused; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        @media (min-width: 768px) { .custom-scrollbar::-webkit-scrollbar { width: 6px; } }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 20px; }
        
        input[type=range][orient=vertical] { writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 8px; height: 100%; padding: 0 5px; cursor: pointer; }
        .drag-over { border: 2px dashed var(--accent) !important; background-color: var(--accent-light) !important; }
        @media (min-width: 768px) { .playlist-item .actions { opacity: 0; transition: opacity 0.2s; } .playlist-item:hover .actions { opacity: 1; } }

        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .toast-exit-active { transform: translateY(100%); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        #player-bg { transition: background 1s ease-in-out; }

        /* Expansão da Playlist no Mobile */
        @media (max-width: 767px) {
            #right-panel { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: absolute; bottom: 0; left: 0; right: 0; height: calc(100dvh - 80px); transform: translateY(calc(100% - 150px)); z-index: 50; }
            #right-panel.expanded { transform: translateY(0); }
            .drawer-puller { width: 40px; height: 4px; background-color: #4b5563; border-radius: 2px; margin: 6px auto; display: block; }
        }
        @media (min-width: 768px) {
            .drawer-puller { display: none; }
            #right-panel { position: relative; height: auto; transform: none !important; }
        }
        
        /* Tema transitions */
        * { transition: background-color 0.3s, color 0.3s, border-color 0.3s, fill 0.3s; }
    </style>
</head>
<body class="bg-gray-950 min-h-[100dvh] md:min-h-screen text-gray-100 font-sans selection:bg-accent selection:text-white flex items-center justify-center md:p-4 lg:p-8 overflow-hidden md:overflow-auto relative">

    <div class="w-full max-w-5xl bg-gray-900 md:rounded-[2rem] shadow-2xl flex flex-col md:flex-row overflow-hidden border-0 md:border border-gray-800 h-[100dvh] md:h-[85vh] md:min-h-[600px] md:max-h-[800px] relative">
        
        <!-- Lado Esquerdo: Player Principal -->
        <div class="w-full md:w-3/5 p-4 sm:p-6 md:p-8 flex flex-col relative h-[100dvh] md:h-full overflow-y-auto custom-scrollbar flex-shrink-0 md:flex-shrink pb-40 md:pb-8" id="player-bg" style="background: linear-gradient(to bottom, #1f2937 0%, #111827 100%);">
            
            <div class="flex justify-between items-center mb-3 sm:mb-6 md:mb-8 flex-shrink-0 relative z-10">
                <div class="flex items-center gap-2 select-none">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 text-accent" style="filter: drop-shadow(0 0 8px var(--accent-light));" viewBox="0 0 24 24" fill="currentColor"><path d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
                    <span class="text-xs sm:text-sm font-black tracking-[0.2em] text-accent uppercase">Emera Player</span>
                </div>

                <div class="flex items-center gap-2">
                    <button id="install-app-btn" class="hidden text-[10px] sm:text-xs bg-accentHover text-white py-1.5 px-3 rounded-full transition flex items-center gap-1.5 shadow-sm"><svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg><span class="hidden sm:inline">Instalar</span></button>
                    <button id="settings-btn" class="text-gray-300 hover:text-white transition" title="Definições"><svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></button>
                </div>
            </div>

            <!-- Capa do Álbum / Disco -->
            <div class="flex-1 min-h-0 flex items-center justify-center mb-4 sm:mb-6 md:mb-8 relative z-10">
                <div id="cover-container" class="relative w-auto h-full aspect-square max-h-[30vh] sm:max-h-48 md:max-h-72 rounded-full shadow-[0_0_30px_rgba(0,0,0,0.5)] md:shadow-[0_0_50px_rgba(0,0,0,0.5)] overflow-hidden border-4 border-gray-800 flex items-center justify-center group cursor-pointer hover:scale-[1.02] active:scale-[0.98] transition-transform" title="Clique para mudar o efeito visual">
                    <img id="cover-art" crossorigin="anonymous" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&h=500&fit=crop" alt="Capa da Música" class="w-full h-full object-cover spin-slow spin-paused transition-all duration-500 relative z-10 bg-gray-800 pointer-events-none">
                    <canvas id="visualizer" class="absolute inset-0 w-full h-full z-20 opacity-60 pointer-events-none mix-blend-screen"></canvas>
                    <div class="absolute inset-0 m-auto w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 bg-gray-900 rounded-full border-2 border-gray-700 shadow-inner z-30 pointer-events-none"></div>
                </div>
            </div>

            <!-- Informações da Música -->
            <div class="text-center mb-4 sm:mb-6 md:mb-8 relative flex-shrink-0 z-10 flex flex-col items-center">
                <div class="absolute right-0 top-0 flex gap-2">
                    <button id="share-btn" class="text-gray-300 hover:text-accent transition hidden" title="Partilhar"><svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg></button>
                    <button id="main-favorite-btn" class="text-gray-300 hover:text-red-500 transition hidden"><svg class="w-6 h-6 md:w-7 md:h-7" id="main-fav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg></button>
                </div>
                <h2 id="track-title" class="text-lg sm:text-xl md:text-3xl font-bold text-white truncate px-10 md:px-14 w-full" style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Playlist Vazia</h2>
                <p id="track-artist" class="text-gray-300 mt-1 md:mt-2 text-xs sm:text-sm md:text-base">Adicione músicas para começar</p>
            </div>

            <!-- Controles de Progresso -->
            <div id="progress-wrapper" class="mb-4 sm:mb-6 md:mb-8 w-full px-1 sm:px-4 md:px-8 flex-shrink-0 z-10">
                <div class="progress-bar-container group">
                    <div class="progress-fill group-hover:bg-accentHover" id="progress-fill"></div>
                    <input type="range" id="progress-bar" min="0" max="100" value="0" class="standard-slider z-10 relative">
                </div>
                <div class="flex justify-between mt-2 text-[10px] md:text-xs text-gray-300 font-medium tracking-wide">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <!-- Controles de Mídia -->
            <div class="flex items-center justify-center gap-4 sm:gap-6 md:gap-8 flex-shrink-0 pb-2 md:pb-0 z-10">
                <button id="repeat-btn" class="text-gray-300 hover:text-accent transition hidden sm:block" title="Repetir"><svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></button>
                <button id="prev-btn" class="text-white hover:text-accentHover transition transform hover:scale-110"><svg class="w-7 h-7 sm:w-8 sm:h-8 md:w-10 md:h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 19h2V5H5v14z"></path></svg></button>
                <button id="play-pause-btn" class="w-14 h-14 sm:w-16 sm:h-16 md:w-20 md:h-20 bg-accent rounded-full flex items-center justify-center text-white hover:bg-accentHover hover:scale-105 transition" style="box-shadow: 0 0 20px var(--accent-light);">
                    <svg id="play-icon" class="w-6 h-6 md:w-8 md:h-8 ml-1 md:ml-2" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                    <svg id="pause-icon" class="w-6 h-6 md:w-8 md:h-8 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
                </button>
                <button id="next-btn" class="text-white hover:text-accentHover transition transform hover:scale-110"><svg class="w-7 h-7 sm:w-8 sm:h-8 md:w-10 md:h-10" fill="currentColor" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zm14 1h-2v14h2V5z"></path></svg></button>
                <button id="shuffle-btn" class="text-gray-300 hover:text-accent transition hidden sm:block" title="Aleatório"><svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg></button>
                <button id="eq-btn" class="text-gray-300 hover:text-accent transition ml-0 sm:ml-2" title="Equalizador"><svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg></button>
            </div>
        </div>

        <!-- Lado Direito: Listas e Volume (GAVETA NO MOBILE) -->
        <div id="right-panel" class="w-full md:w-2/5 bg-gray-900 md:border-t-0 md:border-l border-gray-800 flex flex-col flex-1 min-h-[35%] md:min-h-0 overflow-hidden shadow-[0_-10px_20px_rgba(0,0,0,0.5)] md:shadow-none rounded-t-[2rem] md:rounded-none">
            
            <div class="drawer-puller cursor-pointer" id="drawer-handle"></div>

            <!-- Controle de Volume -->
            <div class="p-4 md:p-6 border-b border-gray-800 flex items-center gap-3 md:gap-4 flex-shrink-0" id="volume-section">
                <button id="mute-btn" class="text-gray-400 hover:text-white transition"><svg id="vol-icon" class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg></button>
                <div class="progress-bar-container flex-1">
                    <div class="progress-fill" id="vol-fill" style="width: 100%;"></div>
                    <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" class="standard-slider z-10 relative">
                </div>
            </div>

            <!-- Cabeçalho Dinâmico da Lista -->
            <div class="p-4 md:p-6 pb-2 md:pb-2 flex flex-col gap-3 flex-shrink-0 border-b border-gray-800/50 cursor-pointer md:cursor-default" id="list-header">
                <div class="flex justify-between items-end gap-2">
                    <div class="flex flex-col gap-1">
                        <h3 id="list-title" class="text-base md:text-lg font-semibold text-white flex items-center gap-2 pointer-events-none">
                            <svg class="w-4 h-4 md:w-5 md:h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                            Sua Playlist
                        </h3>
                        <select id="sort-select" class="bg-transparent text-[10px] md:text-xs text-gray-400 outline-none hover:text-accent transition cursor-pointer p-0 border-0" onclick="event.stopPropagation()">
                            <option value="recent" class="bg-gray-800 text-white">Adicionadas Recentemente</option>
                            <option value="most_played" class="bg-gray-800 text-white">Mais Tocadas</option>
                        </select>
                    </div>
                    
                    <div id="local-actions" class="flex items-center gap-1.5 sm:gap-2">
                        <input type="file" id="folder-upload" webkitdirectory directory multiple class="sr-only">
                        <label for="folder-upload" class="cursor-pointer text-[10px] md:text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 py-1.5 px-2 md:px-3 rounded-lg border border-gray-700 transition flex items-center gap-1 shadow-sm" title="Importar Pasta Inteira" onclick="event.stopPropagation()">
                            <svg class="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                            <span class="hidden sm:inline">Pasta</span>
                        </label>

                        <input type="file" id="file-upload" accept="audio/*,audio/mp3,audio/wav,audio/mpeg,audio/ogg,.mp3,.wav,.ogg" multiple class="sr-only">
                        <label for="file-upload" class="cursor-pointer text-[10px] md:text-xs bg-accentLight hover:bg-accent text-white py-1.5 px-2 md:px-3 rounded-lg border border-accent transition flex items-center gap-1 shadow-sm" onclick="event.stopPropagation()">
                            <svg class="w-3 h-3 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            <span class="hidden sm:inline">Ficheiros</span>
                        </label>
                    </div>
                </div>
                
                <!-- Pesquisa Local -->
                <div id="local-search-container" class="relative w-full" onclick="event.stopPropagation()">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-3 h-3 md:w-4 md:h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="search-input" placeholder="Procurar..." class="w-full bg-gray-800/50 text-xs sm:text-sm text-gray-200 rounded-lg pl-9 pr-3 py-2 outline-none border border-gray-700 focus:border-accent focus:bg-gray-800 transition">
                </div>
            </div>

            <!-- Lista Renderizada -->
            <div class="flex-1 overflow-y-auto custom-scrollbar p-2 sm:p-4 pb-12" id="list-container"></div>
        </div>
    </div>

    <!-- Modais -->
    <div id="eq-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-gray-900 p-5 sm:p-8 rounded-[1.5rem] border border-gray-800 w-full sm:w-[90%] max-w-md shadow-2xl relative overflow-hidden">
            <div class="flex justify-between items-center mb-4 sm:mb-6 relative z-20">
                <h3 class="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    Equalizador (MP3)
                </h3>
                <button id="close-eq-btn" class="text-gray-400 hover:text-white transition"><svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            
            <div class="flex gap-2 justify-center mb-6 flex-wrap relative z-20">
                <button class="eq-preset-btn text-[10px] sm:text-xs bg-gray-800 hover:bg-accent text-gray-300 hover:text-white px-3 py-1 rounded-full transition" data-preset="0,0,0,0,0">Flat</button>
                <button class="eq-preset-btn text-[10px] sm:text-xs bg-gray-800 hover:bg-accent text-gray-300 hover:text-white px-3 py-1 rounded-full transition" data-preset="5,3,0,2,4">Rock</button>
                <button class="eq-preset-btn text-[10px] sm:text-xs bg-gray-800 hover:bg-accent text-gray-300 hover:text-white px-3 py-1 rounded-full transition" data-preset="6,4,0,-2,-4">Bass</button>
                <button class="eq-preset-btn text-[10px] sm:text-xs bg-gray-800 hover:bg-accent text-gray-300 hover:text-white px-3 py-1 rounded-full transition" data-preset="4,2,-2,3,5">Eletrónica</button>
                <button class="eq-preset-btn text-[10px] sm:text-xs bg-gray-800 hover:bg-accent text-gray-300 hover:text-white px-3 py-1 rounded-full transition" data-preset="2,1,0,2,3">Acústico</button>
            </div>
            
            <div class="relative w-full">
                <canvas id="eq-canvas-bg" class="absolute inset-0 w-full h-full opacity-30 pointer-events-none rounded-lg z-10"></canvas>
                <div class="flex justify-between h-32 sm:h-40 px-1 sm:px-4 relative z-20" id="eq-bands-container"></div>
            </div>
            
            <div class="mt-6 sm:mt-8 flex justify-center relative z-20">
                <button id="reset-eq-btn" class="text-xs sm:text-sm bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white py-2 px-6 rounded-lg border border-gray-700 transition">Repor Ajustes</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300 p-4">

    <!-- Modal Editar Tags -->
    <div id="edit-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300 p-4">
        <div class="bg-gray-900 p-6 sm:p-8 rounded-[1.5rem] border border-gray-800 w-full sm:w-[90%] max-w-sm shadow-2xl">

    <div id="toast-container" class="fixed bottom-4 right-4 sm:bottom-8 sm:right-8 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <audio id="audio-player"></audio>

    <script>
        // --- TEMAS (MATERIAL YOU) ---
        function applyTheme(hex, hover, light) {
            document.documentElement.style.setProperty('--accent', hex);
            document.documentElement.style.setProperty('--accent-hover', hover);
            document.documentElement.style.setProperty('--accent-light', light);
            localStorage.setItem('webPlayerTheme', `${hex},${hover},${light}`);
            
            // Atualizar Favicon SVG dinamicamente
            const svgIcon = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='${hex.replace('#','%23')}'><path d='M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3'/></svg>`;
            document.getElementById('dynamic-favicon').href = svgIcon;
        }
        const savedTheme = localStorage.getItem('webPlayerTheme');
        if (savedTheme) applyTheme(...savedTheme.split(','));
        else applyTheme('#10b981', '#059669', 'rgba(16,185,129,0.2)');

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const colors = e.target.dataset.theme.split(',');
                applyTheme(colors[0], colors[1], colors[2]);
            });
        });

        // --- TOASTS ---
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast-enter bg-accent text-white px-4 py-3 rounded-xl shadow-lg text-xs sm:text-sm flex items-center gap-3 font-medium pointer-events-auto';
            toast.innerHTML = `<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>${message}`;
            document.getElementById('toast-container').appendChild(toast);
            requestAnimationFrame(() => toast.classList.replace('toast-enter', 'toast-enter-active'));
            setTimeout(() => { toast.classList.replace('toast-enter-active', 'toast-exit-active'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // --- BANCO DE DADOS ---
        const DB_NAME = "MusicPlayerDB"; const STORE_NAME = "local_tracks"; let db;
        function initDB() { return new Promise(r => { const req = indexedDB.open(DB_NAME, 1); req.onerror=()=>r(null); req.onsuccess=e=>{db=e.target.result; r(db);}; req.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(STORE_NAME)) e.target.result.createObjectStore(STORE_NAME, {keyPath:"id"});}; }); }
        function saveTrackToDB(track) { if(db){ const t={...track}; delete t.src; db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).put(t); } }
        function deleteTrackFromDB(id) { if(db) db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).delete(id); }
        function loadTracksFromDB() {
            if(!db) return Promise.resolve();
            return new Promise(r => { const req = db.transaction(STORE_NAME, "readonly").objectStore(STORE_NAME).getAll(); req.onsuccess = () => { req.result.forEach(t => { t.src = URL.createObjectURL(t.file); t.playCount = t.playCount||0; t.addedAt = t.addedAt||Date.now(); playlist.push(t); }); r(); }; req.onerror = () => r(); });
        }

        // --- ESTADO ---
        const audio = document.getElementById('audio-player');
        let isPlaying = false, currentTrackIndex = 0, currentSortMode = 'recent', playlist = [], draggedItemIndex = null, trackToEditIndex = null;
        let isShuffle = JSON.parse(localStorage.getItem('webPlayerShuffle')) || false; let isRepeat = JSON.parse(localStorage.getItem('webPlayerRepeat')) || false;
        const savedEq = JSON.parse(localStorage.getItem('webPlayerEq')) || [0,0,0,0,0];
        let savedPreamp = parseFloat(localStorage.getItem('webPlayerPreamp')); if (isNaN(savedPreamp)) savedPreamp = 1.0;
        let audioCtx, sourceNode, preampNode, analyser, eqFilters = [], eqFrequencies = [60, 230, 910, 3600, 14000];
        let visualizerMode = 0; let sleepTimerId = null; let eqModalVisible = false;
        const visualizerNames = ["Radial", "Barras", "Ondas", "Pulso", "Partículas", "Desligado"];

        const DOM = {
            playPause: document.getElementById('play-pause-btn'), playIcon: document.getElementById('play-icon'), pauseIcon: document.getElementById('pause-icon'),
            prev: document.getElementById('prev-btn'), next: document.getElementById('next-btn'), shuffle: document.getElementById('shuffle-btn'), repeat: document.getElementById('repeat-btn'),
            title: document.getElementById('track-title'), artist: document.getElementById('track-artist'), cover: document.getElementById('cover-art'),
            mainFav: document.getElementById('main-favorite-btn'), mainFavIcon: document.getElementById('main-fav-icon'), shareBtn: document.getElementById('share-btn'),
            progWrap: document.getElementById('progress-wrapper'), progBar: document.getElementById('progress-bar'), progFill: document.getElementById('progress-fill'), curTime: document.getElementById('current-time'), totTime: document.getElementById('total-time'),
            volBar: document.getElementById('volume-bar'), volFill: document.getElementById('vol-fill'), mute: document.getElementById('mute-btn'),
            container: document.getElementById('list-container'), fileUpload: document.getElementById('file-upload'), folderUpload: document.getElementById('folder-upload'),
            sortSel: document.getElementById('sort-select'), localSearchWrap: document.getElementById('local-search-container'), search: document.getElementById('search-input'), 
            playerBg: document.getElementById('player-bg'), canvas: document.getElementById('visualizer'), coverContainer: document.getElementById('cover-container'),
            localActions: document.getElementById('local-actions'), listTitle: document.getElementById('list-title'),
            preampSlider: document.getElementById('preamp-slider'), preampDisp: document.getElementById('preamp-value-display'),
            rightPanel: document.getElementById('right-panel'), listHeader: document.getElementById('list-header'), drawerHandle: document.getElementById('drawer-handle'),
            eqCanvasBg: document.getElementById('eq-canvas-bg'), eqModal: document.getElementById('eq-modal')
        };
        const canvasCtx = DOM.canvas.getContext('2d');
        const eqBgCtx = DOM.eqCanvasBg.getContext('2d');

        // --- WEB AUDIO ---
        function initWebAudio() {
            if(audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
                sourceNode = audioCtx.createMediaElementSource(audio); 
                analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
                preampNode = audioCtx.createGain(); preampNode.gain.value = savedPreamp;
                let prev = sourceNode; prev.connect(preampNode); prev = preampNode;
                eqFrequencies.forEach((freq, i) => {
                    let f = audioCtx.createBiquadFilter(); f.type = i===0?'lowshelf':(i===4?'highshelf':'peaking'); f.frequency.value = freq; f.gain.value = savedEq[i]; if(f.type==='peaking') f.Q.value = 1.414;
                    eqFilters.push(f); prev.connect(f); prev = f;
                });
                
                // Compressor Dinâmico (Brickwall Limiter) para proteger contra clipping/distorção
                const compressor = audioCtx.createDynamicsCompressor();
                compressor.threshold.value = -3.0;   // Começa a segurar ligeiramente antes do limite (0dB)
                compressor.knee.value = 12.0;        // Curva suave para não soar artificial
                compressor.ratio.value = 20.0;       // Rácio agressivo (age como um "muro")
                compressor.attack.value = 0.002;     // Reage quase instantaneamente a picos graves
                compressor.release.value = 0.100;    // Solta rápido para manter o balanço da música
                
                prev.connect(analyser); 
                analyser.connect(compressor); 
                compressor.connect(audioCtx.destination); 
                drawVisualizer(); 
            } catch(e) {}
        }

        let audioUnlocked = false;
        function unlockAudio() { if(audioUnlocked) return; initWebAudio(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); audioUnlocked = true; document.body.removeEventListener('touchstart', unlockAudio); document.body.removeEventListener('click', unlockAudio); }
        document.body.addEventListener('touchstart', unlockAudio, { once: true }); document.body.addEventListener('click', unlockAudio, { once: true });
        
        if(window.MobileDragDrop) { MobileDragDrop.polyfill({ holdToDrag: 500, dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride }); window.addEventListener('touchmove', e => { if (document.body.classList.contains('dnd-poly-drag-active')) { e.preventDefault(); } }, {passive:false}); }

        DOM.coverContainer.addEventListener('click', () => { 
            visualizerMode = (visualizerMode + 1) % visualizerNames.length; 
            if (visualizerMode === 5) {
                const W = DOM.canvas.clientWidth; const H = DOM.canvas.clientHeight;
                canvasCtx.clearRect(0, 0, W, H);
            }
            showToast(`Efeito: ${visualizerNames[visualizerMode]}`); 
        });

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!isPlaying || visualizerMode === 5) return; 

            const W = DOM.canvas.clientWidth; const H = DOM.canvas.clientHeight;
            if(DOM.canvas.width !== W || DOM.canvas.height !== H) { DOM.canvas.width = W; DOM.canvas.height = H; }
            canvasCtx.clearRect(0, 0, W, H);
            
            const bufferL = 128; const dataFreq = new Uint8Array(bufferL); const dataTime = new Uint8Array(bufferL);
            
            if (analyser) {
                if(visualizerMode === 2) analyser.getByteTimeDomainData(dataTime); else analyser.getByteFrequencyData(dataFreq);
            }

            // Acentuação Visual com base na variável CSS
            const accentRGB = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
            const strokeColor = accentRGB.startsWith('#') ? accentRGB : '#10b981';

            canvasCtx.lineWidth = 3;

            if (visualizerMode === 0) {
                const cX = W/2, cY = H/2, R = W/2;
                for (let i=0; i<bufferL; i++) {
                    if (dataFreq[i] === 0) continue; const h = dataFreq[i] / 2; const a = (i/bufferL)*Math.PI*2;
                    canvasCtx.beginPath(); canvasCtx.moveTo(cX+Math.cos(a)*(R-h), cY+Math.sin(a)*(R-h)); canvasCtx.lineTo(cX+Math.cos(a)*R, cY+Math.sin(a)*R); 
                    canvasCtx.strokeStyle = `rgba(255,255,255, ${dataFreq[i]/255})`; // Fica melhor branco suave em temas variados
                    canvasCtx.stroke();
                }
            } else if (visualizerMode === 1) {
                const barW = (W / bufferL) * 2.5; let x = 0;
                for(let i=0; i<bufferL; i++) { const barH = dataFreq[i] * (H/255) * 0.8; canvasCtx.fillStyle = strokeColor; canvasCtx.globalAlpha = dataFreq[i]/255; canvasCtx.fillRect(x, H - barH, barW, barH); x += barW + 1; }
                canvasCtx.globalAlpha = 1;
            } else if (visualizerMode === 2) {
                canvasCtx.beginPath(); const sliceW = W * 1.0 / bufferL; let x = 0;
                for(let i=0; i<bufferL; i++) { const v = dataTime[i] / 128.0; const y = v * H/2; if(i===0) canvasCtx.moveTo(x, y); else canvasCtx.lineTo(x, y); x += sliceW; }
                canvasCtx.lineTo(W, H/2); canvasCtx.strokeStyle = strokeColor; canvasCtx.stroke();
            } else if (visualizerMode === 3) {
                // Efeito Pulso (Grave)
                let bass = 0; for(let i=0; i<10; i++) bass += dataFreq[i]; bass = bass/10;
                const cX = W/2, cY = H/2;
                canvasCtx.beginPath(); canvasCtx.arc(cX, cY, (W/2.5) + (bass*0.5), 0, Math.PI*2);
                canvasCtx.fillStyle = strokeColor; canvasCtx.globalAlpha = bass/255 * 0.4; canvasCtx.fill();
                canvasCtx.beginPath(); canvasCtx.arc(cX, cY, (W/3) + (bass*0.2), 0, Math.PI*2);
                canvasCtx.strokeStyle = strokeColor; canvasCtx.globalAlpha = bass/255; canvasCtx.stroke();
                canvasCtx.globalAlpha = 1;
            } else if (visualizerMode === 4) {
                // Efeito Partículas
                const cX = W/2, cY = H/2;
                for (let i = 0; i < bufferL; i+=2) {
                    if (dataFreq[i] === 0) continue;
                    const a = (i/bufferL)*Math.PI*2;
                    const dist = (W/2.8) + (dataFreq[i]*0.8);
                    const px = cX + Math.cos(a) * dist; const py = cY + Math.sin(a) * dist;
                    canvasCtx.beginPath(); canvasCtx.arc(px, py, 2 + (dataFreq[i]/80), 0, Math.PI*2);
                    canvasCtx.fillStyle = `rgba(255,255,255, ${dataFreq[i]/255})`;
                    canvasCtx.fill();
                }
            }

            // Equalizador Analítico (Espetrograma)
            if (eqModalVisible && analyser) {
                const eW = DOM.eqCanvasBg.clientWidth; const eH = DOM.eqCanvasBg.clientHeight;
                if(DOM.eqCanvasBg.width !== eW) { DOM.eqCanvasBg.width = eW; DOM.eqCanvasBg.height = eH; }
                eqBgCtx.clearRect(0,0,eW,eH);
                const barW = eW / 32; let eX = 0;
                for(let i=0; i<32; i++) {
                    const val = dataFreq[i*2] || 0; const barH = (val/255) * eH;
                    eqBgCtx.fillStyle = strokeColor; eqBgCtx.fillRect(eX, eH - barH, barW-1, barH); eX += barW;
                }
            }
        }

        // --- EQ E PRÉ-AMP DOM ---
        eqFrequencies.forEach((freq, i) => {
            const col = document.createElement('div'); col.className = 'flex flex-col items-center h-full relative z-20';
            const s = document.createElement('input'); s.type = 'range'; s.setAttribute('orient', 'vertical'); s.min = -12; s.max = 12; s.step = 0.5; s.value = savedEq[i]; s.className = 'flex-1 cursor-pointer w-full max-w-[20px]';
            s.style.accentColor = 'var(--accent)';
            s.addEventListener('input', e => { const v=parseFloat(e.target.value); if(eqFilters[i]) eqFilters[i].gain.value = v; savedEq[i]=v; localStorage.setItem('webPlayerEq', JSON.stringify(savedEq)); });
            const l = document.createElement('span'); l.className = 'text-[9px] sm:text-[11px] text-gray-400 mt-2 sm:mt-3 font-mono font-bold'; l.textContent = freq>=1000?(freq/1000)+'k':freq; col.appendChild(s); col.appendChild(l); document.getElementById('eq-bands-container').appendChild(col);
        });
        document.querySelectorAll('.eq-preset-btn').forEach(btn => btn.addEventListener('click', e => {
            const p = e.target.dataset.preset.split(',').map(Number); document.getElementById('eq-bands-container').querySelectorAll('input[type=range]').forEach((s,i) => { s.value = p[i]; if(eqFilters[i]) eqFilters[i].gain.value = p[i]; savedEq[i]=p[i]; });
            localStorage.setItem('webPlayerEq', JSON.stringify(savedEq)); showToast(`Preset: ${e.target.textContent}`);
        }));

        DOM.preampSlider.value = savedPreamp; DOM.preampDisp.textContent = Math.round(savedPreamp * 100) + '%';
        DOM.preampSlider.addEventListener('input', (e) => { const val = parseFloat(e.target.value); savedPreamp = val; if (preampNode) preampNode.gain.value = val; DOM.preampDisp.textContent = Math.round(val * 100) + '%'; localStorage.setItem('webPlayerPreamp', val); });

        const tModal = (m, s) => { 
            if(s){m.classList.remove('hidden'); setTimeout(()=>m.classList.remove('opacity-0'),10);} 
            else{m.classList.add('opacity-0'); setTimeout(()=>m.classList.add('hidden'),300);} 
            if(m === DOM.eqModal) eqModalVisible = s;
        };
        
        document.getElementById('eq-btn').addEventListener('click', () => { tModal(DOM.eqModal, true); });
        document.getElementById('close-eq-btn').addEventListener('click', () => tModal(DOM.eqModal, false));
        document.getElementById('settings-btn').addEventListener('click', () => tModal(document.getElementById('settings-modal'), true));
        document.getElementById('close-settings-btn').addEventListener('click', () => tModal(document.getElementById('settings-modal'), false));
        document.getElementById('reset-eq-btn').addEventListener('click', () => { document.getElementById('eq-bands-container').querySelectorAll('input').forEach((s,i) => { s.value=0; if(eqFilters[i])eqFilters[i].gain.value=0; savedEq[i]=0; }); localStorage.setItem('webPlayerEq', JSON.stringify(savedEq)); showToast("Equalizador reposto"); });
        document.getElementById('clear-db-btn').addEventListener('click', () => { if(confirm("Apagar todas as músicas permanentemente?")) { localStorage.clear(); indexedDB.deleteDatabase(DB_NAME).onsuccess = () => window.location.reload(); } });
        document.getElementById('start-timer-btn').addEventListener('click', () => {
            const mins = parseInt(document.getElementById('sleep-timer-input').value); if(isNaN(mins) || mins <= 0) return;
            if(sleepTimerId) clearTimeout(sleepTimerId); sleepTimerId = setTimeout(() => { if(isPlaying) togglePlay(); showToast("Temporizador: Música pausada."); }, mins * 60000);
            showToast(`Vai parar em ${mins} min`); tModal(document.getElementById('settings-modal'), false);
        });
        document.getElementById('speed-select').addEventListener('change', (e) => { audio.playbackRate = parseFloat(e.target.value); showToast(`Velocidade: ${e.target.value}x`); });

        // --- GAVETA EXPANSÍVEL (MOBILE) ---
        let isDrawerExpanded = false;
        function toggleDrawer(e) {
            if (window.innerWidth >= 768) return; 
            if(e && (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'LABEL' || e.target.tagName === 'SELECT')) return;
            isDrawerExpanded = !isDrawerExpanded;
            if (isDrawerExpanded) DOM.rightPanel.classList.add('expanded'); else DOM.rightPanel.classList.remove('expanded');
        }
        DOM.listHeader.addEventListener('click', toggleDrawer); DOM.drawerHandle.addEventListener('click', toggleDrawer);

        // --- PARTILHA SOCIAL ---
        DOM.shareBtn.addEventListener('click', async () => {
            const t = playlist[currentTrackIndex];
            if (!t) return;
            const shareData = { title: "Emera Player", text: `A ouvir ${t.title} de ${t.artist} no Emera Player!`, url: window.location.href };
            try { if(navigator.share) await navigator.share(shareData); else throw new Error(); } 
            catch(err) { showToast("Partilha não suportada no seu navegador."); }
        });

        // --- EDIÇÃO DE METADADOS ---
        const editModal = document.getElementById('edit-modal');
        const editTitleIn = document.getElementById('edit-title-input'); const editArtistIn = document.getElementById('edit-artist-input');
        
        document.getElementById('cancel-edit-btn').addEventListener('click', () => { tModal(editModal, false); trackToEditIndex = null; });
        document.getElementById('save-edit-btn').addEventListener('click', () => {
            if(trackToEditIndex !== null && playlist[trackToEditIndex]) {
                const t = playlist[trackToEditIndex];
                t.title = editTitleIn.value || "Desconhecido"; t.artist = editArtistIn.value || "Desconhecido";
                if(t.isLocal && t.id) saveTrackToDB(t);
                if(trackToEditIndex === currentTrackIndex) { DOM.title.textContent = t.title; DOM.artist.textContent = t.artist; }
                renderList(); showToast("Informações guardadas");
            }
            tModal(editModal, false);
        });

        // --- CHAMELEON UI (Cores) ---
        function getAverageColor(img) {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); canvas.width = 50; canvas.height = 50;
            try { ctx.drawImage(img, 0, 0, 50, 50); const data = ctx.getImageData(0, 0, 50, 50).data; let r=0, g=0, b=0, count=0; for (let i=0; i<data.length; i+=4) { r+=data[i]; g+=data[i+1]; b+=data[i+2]; count++; } return `rgb(${~~(r/count)}, ${~~(g/count)}, ${~~(b/count)})`; } catch(e) { return null; }
        }
        DOM.cover.addEventListener('load', () => {
            const color = getAverageColor(DOM.cover);
            if(color) DOM.playerBg.style.background = `linear-gradient(to bottom, ${color} 0%, rgba(17, 24, 39, 0.95) 40%, #111827 100%)`;
            else DOM.playerBg.style.background = `linear-gradient(to bottom, #1f2937 0%, #111827 100%)`;
        });

        function updateMainFavoriteIcon() {
            if(playlist.length===0){ DOM.mainFav.classList.add('hidden'); return; }
            DOM.mainFav.classList.remove('hidden'); const isFav = playlist[currentTrackIndex]?.favorite || false;
            DOM.mainFavIcon.setAttribute('fill', isFav ? 'currentColor' : 'none'); DOM.mainFavIcon.classList.toggle('text-red-500', isFav); DOM.mainFavIcon.classList.toggle('text-gray-300', !isFav);
        }

        function loadTrack(index) {
            if(playlist.length===0) return;
            if(index < 0) index = playlist.length-1; if(index >= playlist.length) index = 0;
            currentTrackIndex = index; const t = playlist[currentTrackIndex]; DOM.cover.classList.remove('static-noise');
            if(t.isLocal) audio.removeAttribute('crossorigin'); else audio.setAttribute('crossorigin', 'anonymous'); audio.src = t.src; 

            DOM.title.textContent = t.title; DOM.artist.textContent = t.artist || t.genre;
            DOM.cover.src = t.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&h=500&fit=crop';
            DOM.shareBtn.classList.remove('hidden'); updateMainFavoriteIcon(); renderList();
            
            // Media Keys & System Integration
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, artwork: [{ src: DOM.cover.src, sizes: '500x500', type: 'image/jpeg' }]});
                navigator.mediaSession.setActionHandler('play', togglePlay); navigator.mediaSession.setActionHandler('pause', togglePlay);
                navigator.mediaSession.setActionHandler('previoustrack', prevTrack); navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
            }
            
            if (isPlaying) { 
                const p = audio.play(); 
                if(p!==undefined) p.then(()=>{ t.playCount=(t.playCount||0)+1; if(t.isLocal) saveTrackToDB(t); }).catch((err)=>{ 
                    console.warn(err); isPlaying=false; DOM.playIcon.classList.remove('hidden'); DOM.pauseIcon.classList.add('hidden'); DOM.cover.classList.add('spin-paused'); showToast("Erro ao reproduzir ficheiro.");
                }); 
            }
        }

        function togglePlay() {
            if(playlist.length===0) return; 
            initWebAudio(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); 

            if(isPlaying) {
                audio.pause(); DOM.playIcon.classList.remove('hidden'); DOM.pauseIcon.classList.add('hidden'); DOM.cover.classList.add('spin-paused'); isPlaying=false;
            } else { 
                const p = audio.play(); 
                if(p!==undefined) {
                    p.then(()=>{ 
                        DOM.playIcon.classList.add('hidden'); DOM.pauseIcon.classList.remove('hidden'); DOM.cover.classList.remove('spin-paused'); isPlaying=true; 
                        const t=playlist[currentTrackIndex]; t.playCount=(t.playCount||0)+1; if(t.isLocal)saveTrackToDB(t); renderList(); 
                    }).catch((err)=>{ console.warn(err); showToast("Formato não suportado."); isPlaying=false; }); 
                } else { isPlaying=true; DOM.playIcon.classList.add('hidden'); DOM.pauseIcon.classList.remove('hidden'); DOM.cover.classList.remove('spin-paused'); renderList(); }
            }
        }

        function nextTrack() {
            if(playlist.length===0) return; let nI = currentTrackIndex+1; if(isShuffle){ nI = Math.floor(Math.random()*playlist.length); if(nI===currentTrackIndex && playlist.length>1) nI=(nI+1)%playlist.length; } else if(nI>=playlist.length) nI=0; loadTrack(nI); if(!isPlaying) togglePlay(); 
        }
        function prevTrack() {
            loadTrack(currentTrackIndex-1); if(isPlaying) audio.play(); 
        }

        audio.addEventListener('timeupdate', () => {
            if(isNaN(audio.duration)) return; 
            const pct = (audio.currentTime/audio.duration)*100; DOM.progBar.value = pct; DOM.progFill.style.width = pct+'%';
            const fT = s => `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; DOM.curTime.textContent = fT(audio.currentTime); DOM.totTime.textContent = fT(audio.duration);
        });
        DOM.progBar.addEventListener('input', e => { audio.currentTime = (e.target.value*audio.duration)/100; });
        
        DOM.volBar.addEventListener('input', e => { const v = e.target.value; audio.volume = v; DOM.volFill.style.width = v*100+'%'; const m = (v==0); audio.muted = m; localStorage.setItem('webPlayerVol', v); });
        DOM.mute.addEventListener('click', () => { const m = !audio.muted; audio.muted = m; if(m){DOM.volBar.value=0; DOM.volFill.style.width='0%';}else{DOM.volBar.value=parseFloat(localStorage.getItem('webPlayerVol'))||0.5; DOM.volFill.style.width=DOM.volBar.value*100+'%';} });

        function updateCtrlBtns() { DOM.shuffle.classList.toggle('text-accent', isShuffle); DOM.shuffle.classList.toggle('text-gray-300', !isShuffle); DOM.repeat.classList.toggle('text-accent', isRepeat); DOM.repeat.classList.toggle('text-gray-300', !isRepeat); }
        DOM.shuffle.addEventListener('click', () => { isShuffle=!isShuffle; localStorage.setItem('webPlayerShuffle', isShuffle); updateCtrlBtns(); showToast(isShuffle?"Aleatório Ligado":"Aleatório Desligado"); });
        DOM.repeat.addEventListener('click', () => { isRepeat=!isRepeat; localStorage.setItem('webPlayerRepeat', isRepeat); updateCtrlBtns(); showToast(isRepeat?"Repetir Ligado":"Repetir Desligado"); });

        // --- ORDENAÇÃO E RENDERIZAÇÃO ---
        DOM.sortSel.addEventListener('change', e => { currentSortMode = e.target.value; sortPlaylistArray(); renderList(); showToast(e.target.value==='recent'?"Mais Recentes":"Mais Tocadas"); });
        DOM.search.addEventListener('input', () => renderList()); 

        function sortPlaylistArray() { if(playlist.length===0) return; const cT = playlist[currentTrackIndex]; if(currentSortMode==='most_played') playlist.sort((a,b)=>(b.playCount||0)-(a.playCount||0)); else playlist.sort((a,b)=>(b.addedAt||0)-(a.addedAt||0)); currentTrackIndex = playlist.indexOf(cT); }

        function renderList() {
            DOM.container.innerHTML = ''; const term = DOM.search.value.toLowerCase(); const isSearching = term.length > 0;

            playlist.forEach((track, index) => {
                if(isSearching && !track.title.toLowerCase().includes(term) && !track.artist.toLowerCase().includes(term)) return;
                const isActive = index === currentTrackIndex;
                const item = document.createElement('div'); item.draggable = !isSearching; item.className = `playlist-item flex items-center gap-2 sm:gap-3 p-2 sm:p-3 rounded-xl cursor-pointer transition mb-2 border ${isActive ? 'bg-accentLight border-accent/30' : 'border-transparent hover:bg-gray-800'}`;
                
                if(!isSearching) {
                    item.addEventListener('dragstart', e => { draggedItemIndex=index; e.dataTransfer.effectAllowed='move'; if(navigator.vibrate) navigator.vibrate(50); setTimeout(()=>item.classList.add('opacity-50'),0); });
                    item.addEventListener('dragend', () => { draggedItemIndex=null; item.classList.remove('opacity-50'); document.querySelectorAll('.playlist-item').forEach(el=>el.classList.remove('drag-over')); });
                    item.addEventListener('dragover', e => { e.preventDefault(); if(draggedItemIndex!==index) item.classList.add('drag-over'); });
                    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
                    item.addEventListener('drop', e => {
                        e.preventDefault(); item.classList.remove('drag-over'); if(draggedItemIndex===null || draggedItemIndex===index) return;
                        const dT = playlist.splice(draggedItemIndex, 1)[0]; playlist.splice(index, 0, dT);
                        if(currentTrackIndex===draggedItemIndex) currentTrackIndex=index; else if(draggedItemIndex<currentTrackIndex && index>=currentTrackIndex) currentTrackIndex--; else if(draggedItemIndex>currentTrackIndex && index<=currentTrackIndex) currentTrackIndex++;
                        if(DOM.sortSel.value!=='recent'){ DOM.sortSel.value='recent'; currentSortMode='recent'; showToast("Ordem Manual"); } renderList();
                    });
                }

                const playingBars = isActive && isPlaying ? `<div class="flex items-end gap-0.5 h-3 w-3 sm:h-4 sm:w-4 ml-1 mr-1 flex-shrink-0"><div class="w-[3px] sm:w-1 bg-accent animate-[bounce_1s_infinite_0ms] h-full"></div><div class="w-[3px] sm:w-1 bg-accent animate-[bounce_1s_infinite_200ms] h-2/3"></div><div class="w-[3px] sm:w-1 bg-accent animate-[bounce_1s_infinite_400ms] h-4/5"></div></div>` : ``;
                const favFill = track.favorite?'currentColor':'none'; const favColor = track.favorite?'text-red-500':'text-gray-400 hover:text-red-400';
                const playsText = currentSortMode==='most_played'?`<span class="text-[9px] text-accent bg-accentLight px-1 rounded ml-1">${track.playCount||0} plays</span>`:'';

                item.innerHTML = `
                    <div class="cursor-grab active:cursor-grabbing p-1 text-gray-500 hover:text-white transition flex-shrink-0 sm:block touch-action-none"><svg class="w-4 h-4 pointer-events-none ${isSearching?'opacity-20':''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg></div>
                    <img src="${track.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100&h=100&fit=crop'}" crossorigin="anonymous" class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg object-cover shadow-md pointer-events-none flex-shrink-0 bg-gray-800">
                    <div class="flex-1 overflow-hidden pointer-events-none"><h4 class="text-xs sm:text-sm font-semibold truncate ${isActive?'text-accent':'text-gray-200'}">${track.title}</h4><p class="text-[10px] sm:text-xs text-gray-500 truncate flex items-center">${track.artist} ${playsText}</p></div>
                    ${playingBars}
                    <div class="actions flex items-center gap-0 sm:gap-1 flex-shrink-0">
                        <button class="edit-btn p-1.5 sm:p-2 text-gray-400 hover:text-blue-400 transition rounded-full hover:bg-gray-700" data-index="${index}" title="Editar Info"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                        <button class="fav-btn p-1.5 sm:p-2 ${favColor} transition rounded-full hover:bg-gray-700" data-index="${index}" title="Favorito"><svg class="w-4 h-4" fill="${favFill}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg></button>
                        <button class="del-btn p-1.5 sm:p-2 text-gray-400 hover:text-red-500 transition rounded-full hover:bg-gray-700" data-index="${index}" title="Eliminar"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>
                `;
                item.addEventListener('click', e => { if(e.target.closest('.actions')||e.target.closest('.cursor-grab')) return; loadTrack(index); if(!isPlaying) togglePlay(); else audio.play(); });
                DOM.container.appendChild(item);
            });

            document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', e => {
                e.stopPropagation(); trackToEditIndex=parseInt(btn.dataset.index);
                editTitleIn.value = playlist[trackToEditIndex].title; editArtistIn.value = playlist[trackToEditIndex].artist;
                tModal(editModal, true);
            }));
            document.querySelectorAll('.fav-btn').forEach(btn => btn.addEventListener('click', e => {
                e.stopPropagation(); const idx=parseInt(btn.dataset.index); playlist[idx].favorite=!playlist[idx].favorite;
                if(playlist[idx].isLocal) saveTrackToDB(playlist[idx]); renderList(); if(idx===currentTrackIndex) updateMainFavoriteIcon(); showToast(playlist[idx].favorite?"Favorito":"Removido");
            }));
            document.querySelectorAll('.del-btn').forEach(btn => btn.addEventListener('click', e => {
                e.stopPropagation(); const idx=parseInt(btn.dataset.index); const t=playlist[idx];
                if(t.isLocal && t.id) deleteTrackFromDB(t.id); playlist.splice(idx,1); showToast("Eliminado");
                if(playlist.length===0){ 
                    audio.pause(); audio.src=''; isPlaying=false; DOM.playIcon.classList.remove('hidden'); DOM.pauseIcon.classList.add('hidden'); DOM.cover.classList.add('spin-paused'); DOM.title.textContent='Playlist Vazia'; DOM.artist.textContent='Adicione músicas'; DOM.progBar.value=0; DOM.progFill.style.width='0%'; DOM.curTime.textContent='0:00'; DOM.totTime.textContent='0:00'; updateMainFavoriteIcon(); DOM.shareBtn.classList.add('hidden'); if('mediaSession' in navigator)navigator.mediaSession.metadata=null; DOM.playerBg.style.background = '';
                } else { if(idx===currentTrackIndex){ currentTrackIndex=idx>=playlist.length?0:idx; loadTrack(currentTrackIndex); }else if(idx<currentTrackIndex) currentTrackIndex--; } renderList();
            }));
        }

        // --- UPLOAD ---
        function handleFiles(files) {
            if(files.length === 0) return; let loadedCount = 0; let added = 0; showToast(`Lendo ${files.length} ficheiro(s)...`);
            files.forEach(file => {
                if (file.type.startsWith('audio/') || file.name.endsWith('.mp3') || file.name.endsWith('.wav') || file.name.endsWith('.m4a')) {
                    const cleanTitle = file.name.replace(/\.[^/.]+$/, ""); const trackId = 'local_'+Date.now()+'_'+Math.floor(Math.random()*1000);
                    let nT = { id: trackId, title: cleanTitle, artist: "Desconhecido", file: file, src: null, cover: null, favorite: false, isLocal: true, addedAt: Date.now(), playCount: 0 };
                    const finish = () => { nT.src = URL.createObjectURL(file); playlist.unshift(nT); saveTrackToDB(nT); loadedCount++; added++;
                        if(loadedCount === files.length) { if(currentTrackIndex > 0 || playlist.length > added) currentTrackIndex += added; sortPlaylistArray(); renderList(); showToast(`${added} importada(s)`); if(!isPlaying && added === playlist.length) loadTrack(0); }
                    };
                    if (window.jsmediatags) {
                        window.jsmediatags.read(file, { onSuccess: tag => { if(tag.tags.title) nT.title = tag.tags.title; if(tag.tags.artist) nT.artist = tag.tags.artist; if(tag.tags.picture) { let b64 = ""; for (let i=0; i<tag.tags.picture.data.length; i++) b64 += String.fromCharCode(tag.tags.picture.data[i]); nT.cover = `data:${tag.tags.picture.format};base64,${window.btoa(b64)}`; } finish(); }, onError: () => finish() });
                    } else finish();
                } else { loadedCount++; if(loadedCount===files.length && added>0) { sortPlaylistArray(); renderList(); showToast(`${added} importada(s)`); } }
            });
        }
        DOM.fileUpload.addEventListener('change', e => handleFiles(Array.from(e.target.files)));
        DOM.folderUpload.addEventListener('change', e => handleFiles(Array.from(e.target.files)));

        // --- BOTÕES E EVENTOS ---
        DOM.playPause.addEventListener('click', () => { togglePlay(); DOM.playPause.blur(); });
        DOM.next.addEventListener('click', () => { nextTrack(); DOM.next.blur(); });
        DOM.prev.addEventListener('click', () => { prevTrack(); DOM.prev.blur(); });

        audio.addEventListener('ended', () => { if(isRepeat){audio.currentTime=0; audio.play();}else nextTrack(); });
        document.addEventListener('keydown', e => {
            if(e.target.tagName === 'INPUT') return; if(e.target.tagName === 'BUTTON' && e.code === 'Space') e.preventDefault(); 
            switch(e.code) { 
                case 'Space': e.preventDefault(); togglePlay(); break; 
                case 'ArrowRight': e.preventDefault(); nextTrack(); break; 
                case 'ArrowLeft': e.preventDefault(); prevTrack(); break; 
                case 'ArrowUp': e.preventDefault(); DOM.volBar.value=Math.min(1,parseFloat(DOM.volBar.value)+0.1); DOM.volBar.dispatchEvent(new Event('input')); break; 
                case 'ArrowDown': e.preventDefault(); DOM.volBar.value=Math.max(0,parseFloat(DOM.volBar.value)-0.1); DOM.volBar.dispatchEvent(new Event('input')); break; 
            }
        });
        
        updateCtrlBtns();
        initDB().then(async () => {
            await loadTracksFromDB(); sortPlaylistArray(); renderList();
            if(playlist.length>0) loadTrack(0); else { DOM.title.textContent='Playlist Vazia'; DOM.artist.textContent='Adicione músicas para começar'; }
        });
        const initVol = parseFloat(localStorage.getItem('webPlayerVol'));
        if(!isNaN(initVol)){ audio.volume=initVol; DOM.volBar.value=initVol; DOM.volFill.style.width=initVol*100+'%'; audio.muted=(initVol===0); } else { audio.volume=1; }

        // --- PWA ---
        const manifest = { name: "Emera Player", short_name: "Emera", start_url: ".", display: "standalone", background_color: "#111827", theme_color: "#10b981", icons: [{ src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3'/></svg>", sizes: "192x192 512x512", type: "image/svg+xml", purpose: "any maskable" }]};
        const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'})); document.head.appendChild(link);
        const swUrl = URL.createObjectURL(new Blob([`self.addEventListener('install', (e)=>self.skipWaiting()); self.addEventListener('activate', (e)=>self.clients.claim()); self.addEventListener('fetch', (e)=>{});`], {type: 'application/javascript'}));
        if ('serviceWorker' in navigator) navigator.serviceWorker.register(swUrl).catch(()=>{});
        let deferredPrompt; const installBtn = document.getElementById('install-app-btn');
        window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt=e; installBtn.classList.remove('hidden'); });
        installBtn.addEventListener('click', async () => { if(deferredPrompt){deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; installBtn.classList.add('hidden');} });
        window.addEventListener('appinstalled', () => { installBtn.classList.add('hidden'); deferredPrompt=null; });
    </script>
</body>
